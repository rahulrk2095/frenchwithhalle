// ============================================================
//  UNLOCK LOGIC
//  A level can be locked for two reasons:
//   - "pay"  : it's a premium level and the user hasn't unlocked ($5)
//   - "work" : progression gate (previous level not far enough along)
//  Payment is checked first: no point gating by progress on a level
//  the user can't access yet anyway.
// ============================================================
const UNLOCK_NEEDED = (lv) => Math.ceil(lv.units.length * 0.6); // ~60% of prev level
function computeUnlocks(scores, hasPaid) {
  const status = {};
  CURRICULUM.forEach((lv, i) => {
    if (i === 0) { status[lv.level] = { locked: false, reason: null }; return; }
    const prev = CURRICULUM[i - 1];
    const have = prev.units.filter((u) => scores[u.id] != null).length;
    const need = UNLOCK_NEEDED(prev);
    if (isPremiumLevel(lv.level) && !hasPaid) {
      status[lv.level] = { locked: true, reason: "pay", need, have, prevName: prev.name };
    } else if (have < need) {
      status[lv.level] = { locked: true, reason: "work", need, have, prevName: prev.name };
    } else {
      status[lv.level] = { locked: false, reason: null, need, have, prevName: prev.name };
    }
  });
  return status;
}

const emailValid = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim());
const phoneValid = (p) => /^[0-9 ()-]{6,15}$/.test(p.trim());
// If the user types a number starting with "+", detect the country from the
// longest matching dialing-code prefix. Returns { iso, rest } or null.
function detectFromPrefix(raw) {
  const s = raw.replace(/[^\d+]/g, "");
  if (!s.startsWith("+")) return null;
  const digits = s.slice(1);
  // try longest codes first (e.g. +971 before +97/+9) for an accurate match
  const byLen = [...COUNTRY_CODES].sort((a, b) => b.c.length - a.c.length);
  for (const c of byLen) {
    const code = c.c.slice(1); // without +
    if (digits.startsWith(code)) return { iso: c.iso, rest: digits.slice(code.length) };
  }
  return null;
}

function Landing({ onAuthed }) {
  const [step, setStep] = useState("welcome"); // welcome | details | avatar | login
  const [first, setFirst] = useState("");
  const [last, setLast] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [cc, setCc] = useState("US");
  const [phone, setPhone] = useState("");
  const [avatar, setAvatar] = useState(null);
  const [tab, setTab] = useState("female");
  const [touched, setTouched] = useState(false);
  const [loginEmail, setLoginEmail] = useState("");
  const [loginPassword, setLoginPassword] = useState("");
  const [loginErr, setLoginErr] = useState("");
  const [busy, setBusy] = useState(false);

  const savedAccounts = useMemo(() => listLocalAccounts(), []);
  const dialCode = (COUNTRY_CODES.find((x) => x.iso === cc) || { c: "+1" }).c;
  const passwordOk = password.length >= 8;
  const detailsOk = first.trim() && last.trim() && emailValid(email) && phoneValid(phone) && passwordOk;

  const finish = async () => {
    if (busy) return;
    setBusy(true);
    const result = await registerUser({
      firstName: first, lastName: last, email,
      phone: dialCode + " " + phone.trim(),
      avatar: avatar || defaultAvatar(first + last),
      password,
    });
    setBusy(false);
    if (result.error) { setLoginErr(result.error); return; }
    onAuthed(result);
  };

  const doLogin = async () => {
    if (busy || !emailValid(loginEmail) || !loginPassword) return;
    setBusy(true);
    const result = await loginUser(loginEmail, loginPassword);
    setBusy(false);
    if (result.error) { setLoginErr(result.error); return; }
    onAuthed(result);
  };

  const doQuickLogin = async (acct) => {
    // Quick-switch: still need password for security — redirect to login form
    setLoginEmail(acct.email || "");
    setLoginErr("");
    setStep("login");
  };

  return (
    <div className="landing">
      <div className="grain" />
      <div className="land-inner">
        <div className="land-mark">H</div>
        <p className="eyebrow center">Apprendre le français · A1 → C1</p>
        <h1 className="land-title">French with Halle</h1>

        {step === "welcome" && (
          <>
            <p className="land-sub">A French course that plays like a game. Unlock levels, earn stars, keep your streak alive — and pick up right where you left off, on any device.</p>
            <div className="land-actions">
              <button className="cta" onClick={() => setStep("details")}>Create your account →</button>
              <button className="cta outline" onClick={() => { setLoginErr(""); setStep("login"); }}>Log in to existing account</button>
              <p className="land-fine">New here? Create an account. Already have one? Log in.</p>
            </div>
            <div className="land-feats">
              <div className="lf"><span>🎯</span><p>Daily goals & streaks</p></div>
              <div className="lf"><span>🔓</span><p>Unlock levels as you grow</p></div>
              <div className="lf"><span>🌍</span><p>Sync across all devices</p></div>
            </div>
          </>
        )}

        {step === "login" && (
          <div className="land-form">
            <p className="form-step">Welcome back</p>
            {savedAccounts.length > 0 && (
              <div className="login-accounts">
                <p className="login-pick">Continue as:</p>
                {savedAccounts.map((a) => (
                  <button key={a.id || a.email} className="login-acct" onClick={() => doQuickLogin(a)}>
                    <span className="login-av">{a.avatar}</span>
                    <span className="login-acct-meta"><b>{a.name}</b><span>{a.email}</span></span>
                    <span className="login-go">→</span>
                  </button>
                ))}
                <p className="login-or">or log in with email + password</p>
              </div>
            )}
            <label>Email</label>
            <input className={`field ${loginErr && !loginEmail ? "bad" : ""}`} type="email" autoFocus
              value={loginEmail} placeholder="you@example.com"
              onChange={(e) => { setLoginEmail(e.target.value); setLoginErr(""); }} />
            <label>Password</label>
            <input className="field" type="password" value={loginPassword} placeholder="Your password"
              onChange={(e) => { setLoginPassword(e.target.value); setLoginErr(""); }}
              onKeyDown={(e) => e.key === "Enter" && doLogin()} />
            {loginErr && <p className="form-err">{loginErr}</p>}
            <button className="cta" disabled={busy || !emailValid(loginEmail) || !loginPassword} onClick={doLogin}>
              {busy ? "Logging in…" : "Log in →"}
            </button>
            <button className="textback" onClick={() => setStep("welcome")}>← Back</button>
            <p className="land-fine">No account yet? <button className="link-btn" onClick={() => setStep("details")}>Create one</button></p>
          </div>
        )}

        {step === "details" && (
          <div className="land-form">
            <p className="form-step">Step 1 of 2 · Your details</p>
            <div className="form-2col">
              <div><label>First name</label>
                <input className={`field ${touched && !first.trim() ? "bad" : ""}`} autoFocus value={first} placeholder="Marie" onChange={(e) => setFirst(e.target.value)} /></div>
              <div><label>Last name</label>
                <input className={`field ${touched && !last.trim() ? "bad" : ""}`} value={last} placeholder="Dupont" onChange={(e) => setLast(e.target.value)} /></div>
            </div>
            <label>Email</label>
            <input className={`field ${touched && !emailValid(email) ? "bad" : ""}`} type="email" value={email} placeholder="marie@example.com" onChange={(e) => setEmail(e.target.value)} />
            <label>Password <span style={{fontSize:"12px",color:"var(--soft)"}}>minimum 8 characters</span></label>
            <input className={`field ${touched && !passwordOk ? "bad" : ""}`} type="password" value={password} placeholder="Choose a strong password" onChange={(e) => setPassword(e.target.value)} />
            <label>Phone number</label>
            <div className="phone-row">
              <select className="cc-select" value={cc} onChange={(e) => setCc(e.target.value)} aria-label="Country code">
                {COUNTRY_CODES.map((x) => <option key={x.iso} value={x.iso}>{x.f} {x.n} ({x.c})</option>)}
              </select>
              <input className={`field ${touched && !phoneValid(phone) ? "bad" : ""}`} type="tel" value={phone} placeholder="555 123 4567 (or +33…)"
                onChange={(e) => {
                  const v = e.target.value;
                  const det = detectFromPrefix(v);
                  if (det) { setCc(det.iso); setPhone(det.rest); }
                  else setPhone(v);
                }} />
            </div>
            {touched && !detailsOk && <p className="form-err">Please fill in every field. Password must be at least 8 characters.</p>}
            <button className="cta" onClick={() => { setTouched(true); if (detailsOk) setStep("avatar"); }}>Continue →</button>
            <button className="textback" onClick={() => setStep("welcome")}>← Back</button>
          </div>
        )}

        {step === "avatar" && (
          <div className="land-form">
            <p className="form-step">Step 2 of 2 · Choose your character</p>
            <div className="av-preview">{avatar || "🙂"}</div>
            <div className="av-tabs">
              {[["female", "Female"], ["male", "Male"], ["other", "More"]].map(([k, lab]) => (
                <button key={k} className={`av-tab ${tab === k ? "on" : ""}`} onClick={() => setTab(k)}>{lab}</button>
              ))}
            </div>
            <div className="av-grid">
              {AVATAR_SETS[tab].map((a) => (
                <button key={a} className={`av-opt ${avatar === a ? "on" : ""}`} onClick={() => setAvatar(a)}>{a}</button>
              ))}
            </div>
            {loginErr && <p className="form-err">{loginErr}</p>}
            <button className="cta" disabled={!avatar || busy} onClick={finish}>
              {busy ? "Creating account…" : "Start learning →"}
            </button>
            <button className="textback" onClick={() => setStep("details")}>← Back</button>
          </div>
        )}
      </div>
      <footer className="land-foot">Built for serious, joyful study · <em>bon courage</em></footer>
    </div>
  );
}

          <div className="prof-stat"><b>{doneUnits}/{allUnits.length}</b><span>Units done</span></div>
          <div className="prof-stat"><b>⭐ {totalStars}/{maxStars}</b><span>Stars earned</span></div>
          <div className="prof-stat"><b>{unlocked}/{CURRICULUM.length}</b><span>Levels open</span></div>
        </div>
        <div className="prof-best">Best challenge score: <b>{progress.bestChallenge}</b></div>
        <div className={`prof-plan ${progress.hasPaid ? "pro" : ""}`}>
          {progress.hasPaid ? "✦ Full course unlocked — merci !" : "Free plan · A1 + previews"}
        </div>
        <button className="ghost wide" onClick={onSignOut}>Sign out</button>
      </div>
    </div>
  );
}

// ============================================================
//  PAYWALL MODAL  (the $5 one-time unlock)
// ============================================================
function Paywall({ onClose, onBuy, state }) {
  return (
    <div className="modal-bg" onClick={state === "processing" ? undefined : onClose}>
      <div className="modal paywall" onClick={(e) => e.stopPropagation()}>
        {state !== "processing" && <button className="modal-x" onClick={onClose}>×</button>}
        <div className="pw-badge">✦ Full Course</div>
        <h2 className="pw-title">Unlock every level</h2>
        <p className="pw-price"><b>{PRICE_LABEL}</b> <span>one-time · yours forever</span></p>
        <ul className="pw-list">
          <li>{CURRICULUM.filter(l => isPremiumLevel(l.level)).reduce((s, l) => s + l.units.length, 0)} units across A2 → C1 — grammar, listening, conjugation, fill-in-the-blank & more</li>
          <li>Full conjugation trainer — every major verb, every tense, all 6 forms drilled</li>
          <li>Complete phrasebook — 100+ practical phrases across 10 real-life situations</li>
          <li>Weak-spot tracker — your wrong answers, targeted for fastest improvement</li>
          <li>{READING.filter(r=>r.premium).length} premium reading passages + {DIALOGUES.filter(d=>d.premium).length} premium dialogues</li>
          <li>One payment — no subscription, ever</li>
        </ul>
        {state === "done" ? (
          <div className="pw-done">✓ Unlocked! Bienvenue.</div>
        ) : (
          <button className="cta wide buybtn" disabled={state === "processing"} onClick={onBuy}>
            {state === "processing" ? "Processing…" : `Unlock for ${PRICE_LABEL}`}
          </button>
        )}
        <p className="pw-fine">Demo checkout — no real charge. In the live app this opens secure Stripe payment.</p>
      </div>
    </div>
  );
}

// ============================================================
//  MAIN APP
// ============================================================
function App() {
  const [userKey, setUserKey] = useState(null);
  const [user, setUser] = useState(null);
  const [progress, setProgress] = useState(blankProgress());
  const [route, setRoute] = useState({ name: "home" });
  const [openLevel, setOpenLevel] = useState("A1");
  const [showProfile, setShowProfile] = useState(false);
  const [showPaywall, setShowPaywall] = useState(false);
  const [toast, setToast] = useState(null);
  const [authLoading, setAuthLoading] = useState(true); // true while checking session

  // On startup: check if there's a live Supabase session (auto-resume across page reloads)
  useEffect(() => {
    (async () => {
      try {
        const session = await getSession();
        if (session) {
          const result = await loadProfile(session.user);
          if (!result.error) {
            handleAuth(result);
          }
        }
      } catch (e) {}
      setAuthLoading(false);
    })();
  }, []);

  // called when Landing hands us a { user, progress } result from registerUser / loginUser
  const handleAuth = ({ user: u, progress: p }) => {
    setUser(u);
    setUserKey(u.id);
    const today = dayIdx();
    const merged = { ...blankProgress(), ...p };
    // streak bookkeeping
    if (merged.lastDay == null) merged.streak = 1;
    else if (merged.lastDay === today - 1) merged.streak = (merged.streak || 0) + 1;
    else if (merged.lastDay !== today) merged.streak = 1;
    merged.lastDay = today;
    if (merged.todayDay !== today) { merged.todayDay = today; merged.todayCount = 0; }
    // sync settings into LIVE
    const st = merged.settings || {};
    LIVE.audioSpeed = st.audioSpeed || "normal";
    LIVE.strictAccents = !!st.strictAccents;
    LIVE.autoAdvance = !!st.autoAdvance;
    LIVE.voiceURI = st.voiceURI || null;
    LIVE.pitch = st.pitch || 1;
    setProgress(merged);
    // persist streak update
    saveProgress(u.id, merged);
  };

  // persist: update local state immediately, push to cloud in background
  const persist = useCallback((updater) => {
    setProgress((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (userKey) saveProgress(userKey, next); // cloud save (async, fire-and-forget)
      return next;
    });
  }, [userKey]);

  const unlockStatus = useMemo(() => computeUnlocks(progress.scores, progress.hasPaid), [progress.scores, progress.hasPaid]);

  const awardXP = useCallback((n) => {
    persist((p) => ({ ...p, xp: p.xp + n }));
  }, [persist]);

  const completeUnit = useCallback((unitId, score) => {
    persist((p) => {
      const newScore = Math.max(p.scores[unitId] || 0, score);
      const wasUnlocked = computeUnlocks(p.scores, p.hasPaid);
      const nextScores = { ...p.scores, [unitId]: newScore };
      const nowUnlocked = computeUnlocks(nextScores, p.hasPaid);
      let newlyOpened = null;
      CURRICULUM.forEach((lv) => {
        if (wasUnlocked[lv.level].locked && !nowUnlocked[lv.level].locked) newlyOpened = lv;
      });
      if (newlyOpened) {
        // defer setState out of the updater
        setTimeout(() => {
          setToast({ type: "unlock", level: newlyOpened.level, name: newlyOpened.name });
          setTimeout(() => setToast(null), 4200);
        }, 0);
      }
      return { ...p, scores: nextScores };
    });
  }, [persist]);

  const recordChallenge = useCallback((score) => {
    persist((p) => score > (p.bestChallenge || 0) ? { ...p, bestChallenge: score } : p);
  }, [persist]);

  const claimDaily = useCallback(() => {
    persist((p) => ({ ...p, dailyClaimedDay: dayIdx() }));
  }, [persist]);

  // count every answered question toward today's goal + history (for the calendar)
  const recordAnswer = useCallback(() => {
    persist((p) => {
      const today = dayIdx();
      const sameDay = p.todayDay === today;
      const todayCount = (sameDay ? (p.todayCount || 0) : 0) + 1;
      const history = { ...(p.history || {}), [today]: todayCount };
      return { ...p, todayDay: today, todayCount, history };
    });
  }, [persist]);

  const changeGoal = useCallback((g) => {
    persist((p) => ({ ...p, dailyGoal: g }));
  }, [persist]);

  // schedule a flashcard after the learner rates their recall
  const reviewCard = useCallback((wordId, rating) => {
    persist((p) => {
      const today = dayIdx();
      const srs = { ...(p.srs || {}) };
      srs[wordId] = scheduleCard(srs[wordId], rating, today);
      // track mistakes — "again" means they didn't know it
      const mistakes = { ...(p.mistakes || {}) };
      if (rating === 0) mistakes[wordId] = (mistakes[wordId] || 0) + 1;
      return { ...p, srs, mistakes };
    });
    awardXP(rating === 0 ? 2 : 5);
  }, [persist, awardXP]);

  // record a drill-wrong answer as a mistake (called from Unit drill)
  const recordMistake = useCallback((wordId) => {
    if (!wordId) return;
    persist((p) => {
      const mistakes = { ...(p.mistakes || {}) };
      mistakes[wordId] = (mistakes[wordId] || 0) + 1;
      return { ...p, mistakes };
    });
  }, [persist]);

  const changeSettings = useCallback((next) => {
    // update the live mirror immediately so it affects the current session
    LIVE.audioSpeed = next.audioSpeed || "normal";
    LIVE.strictAccents = !!next.strictAccents;
    LIVE.autoAdvance = !!next.autoAdvance;
    LIVE.voiceURI = next.voiceURI || null;
    LIVE.pitch = next.pitch || 1;
    persist((p) => ({ ...p, settings: next }));
  }, [persist]);

  // ---- purchase the $5 unlock ----
  const [buyState, setBuyState] = useState("idle"); // idle | processing | done
  const startPurchase = useCallback(async () => {
    setBuyState("processing");
    const res = await purchaseUnlock();   // ← becomes the real Stripe call later
    if (res && res.ok) {
      persist((p) => ({ ...p, hasPaid: true }));
      setBuyState("done");
      setTimeout(() => { setBuyState("idle"); setShowPaywall(false); }, 1400);
    } else {
      setBuyState("idle");
    }
  }, [persist]);

  // ---- not signed in ----
  if (!userKey || !user) {
    if (authLoading) return (<><style>{CSS}</style><div className="auth-loading"><div className="land-mark spin">H</div><p>Signing you in…</p></div></>);
    return (<><style>{CSS}</style><Landing onAuthed={handleAuth} /></>);
  }

  // ---- derived display values ----
  const level = Math.floor(progress.xp / 150) + 1;
  const levelProg = Math.round(((progress.xp % 150) / 150) * 100);
  const rankName = ["Débutant", "Apprenti", "Voyageur", "Causeur", "Éloquent", "Maître"][Math.min(level - 1, 5)];
  const totalUnits = allUnits.length;
  const doneUnits = Object.keys(progress.scores).length;
  const dailyClaimed = progress.dailyClaimedDay === dayIdx();
  const goUnit = (u) => setRoute({ name: "unit", unit: u });

  return (
    <div className="root">
      <style>{CSS}</style>
      <div className="grain" />

      {toast && toast.type === "unlock" && (
        <div className="toast">
          <div className="toast-in">
            <span className="toast-key">🔓</span>
            <div><strong>Level {toast.level} unlocked!</strong><p>{toast.name} is now open. Allez-y !</p></div>
          </div>
        </div>
      )}

      <header className="top">
        <div className="logo" onClick={() => setRoute({ name: "home" })}>
          <span className="mark">H</span>
          <div><strong>French with Halle</strong><em>Français · A1 → C1</em></div>
        </div>
        <div className="meta">
          <div className="streakchip" title="Daily streak">🔥 {progress.streak}</div>
          <div className="rank"><span>{rankName}</span><small>Niveau {level}</small></div>
          <button className="gear-btn" onClick={() => setRoute({ name: "settings" })} title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <button className="avatar-btn" onClick={() => setShowProfile(true)} title="Profile">
            <span className="avatar">{avatarOf(user)}</span>
          </button>
        </div>
      </header>

      {showProfile && (
        <Profile user={user} progress={progress} unlockStatus={unlockStatus}
          onClose={() => setShowProfile(false)}
          onChangeAvatar={(a) => { setUserAvatar(userKey, a); setUser({ ...user, avatar: a }); }}
          onSignOut={async () => { await signOut(); setShowProfile(false); setUserKey(null); setUser(null); setProgress(blankProgress()); setRoute({ name: "home" }); }} />
      )}

      {showPaywall && (
        <Paywall state={buyState} onBuy={startPurchase} onClose={() => setShowPaywall(false)} />
      )}

      {route.name === "home" && (
        <main className="home">
          <section className="hero">
            <p className="eyebrow">Bon retour, {user.name.split(" ")[0]} 👋</p>
            <h1>Your <span>journey</span> continues.</h1>
            <p className="lede">Complete units to earn stars and unlock the next level. Keep your streak alive and climb from Débutant to Maître.</p>
            <div className="hero-row">
              <button className="cta" onClick={() => setRoute({ name: "challenge" })}>⚔ Challenge mode</button>
              <button className={`cta outline ${dailyClaimed ? "" : "pulse"}`} onClick={() => setRoute({ name: "daily" })}>
                {dailyClaimed ? "Today's expression ✓" : "✨ Daily +20 XP"}
              </button>
            </div>
            <div className="hero-prog">
              <div className="hp-row"><span>Level {level} · {rankName}</span><span>{progress.xp % 150}/150 XP</span></div>
              <div className="hp-bar"><div style={{ width: `${levelProg}%` }} /></div>
              <span className="hp-units">{doneUnits} / {totalUnits} units mastered</span>
            </div>
          </section>

          <WordOfDay onGoVocab={() => setRoute({ name: "vocab" })} />

          <DailyGoalCard progress={progress} onChangeGoal={changeGoal} onPractise={() => setRoute({ name: "review" })} />

          {(() => {
            const due = countDue(progress.srs || {}, dayIdx());
            const mistakeCount = Object.keys(progress.mistakes || {}).length;
            return (
              <div className="action-row">
                <button className="review-banner half" onClick={() => setRoute({ name: "review" })}>
                  <span className="rev-emoji">🔁</span>
                  <div>
                    <strong>Daily review</strong>
                    <p>Spaced repetition</p>
                  </div>
                  <span className="rev-badge">{due > 0 ? `${due} due` : "Go →"}</span>
                </button>
                <button className={`review-banner half mistakes ${mistakeCount === 0 ? "dim" : ""}`} onClick={() => progress.hasPaid ? setRoute({ name: "mistakes" }) : setShowPaywall(true)}>
                  <span className="rev-emoji">🎯</span>
                  <div>
                    <strong>Weak spots</strong>
                    <p>{progress.hasPaid ? "Target your errors" : "Premium"}</p>
                  </div>
                  <span className="rev-badge">{mistakeCount > 0 ? `${mistakeCount} →` : "–"}</span>
                </button>
              </div>
            );
          })()}

          {!progress.hasPaid && (
            <button className="upsell" onClick={() => setShowPaywall(true)}>
              <div className="upsell-l">
                <span className="upsell-badge">✦</span>
                <div>
                  <strong>Unlock the full course</strong>
                  <p>All levels A2 → C1, conjugation trainer, full phrasebook, weak-spot tracker · {PRICE_LABEL} forever</p>
                </div>
              </div>
              <span className="upsell-cta">Unlock {PRICE_LABEL} →</span>
            </button>
          )}

          <div className="ref-cards ref-cards-3">
            <button className="ref-card" onClick={() => setRoute({ name: "vocab" })}>
              <span className="ref-emoji">🗂️</span>
              <div><strong>Flashcard library</strong><p>{VOCAB_FLAT.length} voiced words</p></div>
            </button>
            <button className="ref-card" onClick={() => setRoute({ name: "reading" })}>
              <span className="ref-emoji">📰</span>
              <div><strong>Reading</strong><p>{READING.length} graded texts</p></div>
            </button>
            <button className="ref-card" onClick={() => setRoute({ name: "dialogues" })}>
              <span className="ref-emoji">💬</span>
              <div><strong>Dialogues</strong><p>{DIALOGUES.length} real conversations</p></div>
            </button>
            <button className="ref-card" onClick={() => setRoute({ name: "phrasebook" })}>
              <span className="ref-emoji">📋</span>
              <div><strong>Phrasebook</strong><p>Practical French phrases</p></div>
            </button>
            <button className="ref-card" onClick={() => progress.hasPaid ? setRoute({ name: "conjugation" }) : setShowPaywall(true)}>
              <span className="ref-emoji">📝</span>
              <div><strong>Conjugation {!progress.hasPaid ? "🔒" : ""}</strong><p>Verb drills, all tenses</p></div>
            </button>
            <button className="ref-card" onClick={() => setRoute({ name: "grammar" })}>
              <span className="ref-emoji">📖</span>
              <div><strong>Grammar</strong><p>Every rule, by level</p></div>
            </button>
            <button className="ref-card" onClick={() => setRoute({ name: "pronunciation" })}>
              <span className="ref-emoji">🔊</span>
              <div><strong>Pronunciation</strong><p>IPA guide, spoken</p></div>
            </button>
            <button className="ref-card" onClick={() => setRoute({ name: "culture" })}>
              <span className="ref-emoji">🇫🇷</span>
              <div><strong>Culture notes</strong><p>Real French life</p></div>
            </button>
          </div>

          <h3 className="sec-title">Levels</h3>
          <div className="levels">
            {CURRICULUM.map((lv, idx) => {
              const st = unlockStatus[lv.level];
              const lvDone = lv.units.filter((u) => progress.scores[u.id] != null).length;
              const lvStars = lv.units.reduce((s, u) => s + starsFor(progress.scores[u.id]), 0);
              const payLocked = st.reason === "pay";
              // Premium levels are still expandable so the free taster shows.
              const isOpen = openLevel === lv.level && (!st.locked || payLocked);
              return (
                <section key={lv.level} className={`lvl ${isOpen ? "open" : ""} ${st.locked ? "locked" : ""} ${payLocked ? "paylock" : ""}`}>
                  <button className="lvl-head" onClick={() => {
                    if (st.locked && !payLocked) return;           // progression-locked: not clickable
                    setOpenLevel(isOpen ? "" : lv.level);          // free + paylocked: expandable
                  }}>
                    <span className="badge">{payLocked ? "✦" : st.locked ? "🔒" : lv.level}</span>
                    <div className="lvl-meta">
                      <h2>{lv.name} <small className="lvl-code">{lv.level}</small></h2>
                      {payLocked
                        ? <p className="pay-msg">First unit free to preview · unlock everything for {PRICE_LABEL}</p>
                        : st.locked
                          ? <p className="lock-msg">Complete {st.need - st.have} more unit{st.need - st.have > 1 ? "s" : ""} in {st.prevName} to unlock</p>
                          : <p>{lv.sub} — {lv.desc}</p>}
                    </div>
                    <div className="lvl-side">
                      {payLocked && <span className="pay-pill">Free preview</span>}
                      {!st.locked && <span className="lvl-stars">⭐ {lvStars}/{lv.units.length * 3}</span>}
                      <span className="lvl-frac">{lvDone}/{lv.units.length}</span>
                      {(!st.locked || payLocked) && <span className="chev">{isOpen ? "−" : "+"}</span>}
                    </div>
                  </button>
                  {isOpen && (
                    <div className="units">
                      {lv.units.map((u, n) => {
                        const sc = progress.scores[u.id];
                        const st3 = starsFor(sc);
                        const access = canAccessUnit(lv.level, n, progress.hasPaid);
                        const taster = isTasterUnit(lv.level, n) && !progress.hasPaid;
                        return (
                          <button key={u.id} className={`unit-card ${!access ? "uclocked" : ""} ${taster ? "uctaster" : ""}`} style={{ animationDelay: `${n * 60}ms` }}
                            onClick={() => access ? goUnit({ ...u, level: lv.level }) : setShowPaywall(true)}>
                            <div className="uc-head">
                              <h3>{u.title}</h3>
                              {taster ? <span className="uc-taster">FREE</span>
                                : !access ? <span className="uc-lock">🔒</span>
                                : sc != null ? <span className={`uc-score ${sc === 100 ? "perfect" : ""}`}>{sc}%</span> : null}
                            </div>
                            <p className="uc-focus">{u.focus}</p>
                            {access ? (
                              <div className="uc-stars">
                                {[1, 2, 3].map((i) => <span key={i} className={i <= st3 ? "on" : ""}>★</span>)}
                              </div>
                            ) : <div className="uc-stars dim">{[1,2,3].map(i=><span key={i}>★</span>)}</div>}
                            <div className="uc-foot">
                              <span>{u.vocab.length} words · {u.ex.length} drills</span>
                              <span className="uc-go">{!access ? `Unlock ${PRICE_LABEL} →` : taster ? "Try free →" : sc != null ? "Replay →" : "Start →"}</span>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </section>
              );
            })}
          </div>
        </main>
      )}

      {route.name === "unit" && (
        <main className="page">
          <Unit unit={route.unit} onBack={() => setRoute({ name: "home" })} onComplete={completeUnit}
            awardXP={awardXP} onAnswered={recordAnswer} autoAdvance={!!(progress.settings && progress.settings.autoAdvance)} />
        </main>
      )}
      {route.name === "challenge" && (
        <main className="page"><Challenge onExit={() => setRoute({ name: "home" })} awardXP={awardXP} onFinish={recordChallenge} onAnswered={recordAnswer} /></main>
      )}
      {route.name === "daily" && (
        <main className="page"><Daily onExit={() => setRoute({ name: "home" })} awardXP={awardXP} claimed={dailyClaimed} claim={claimDaily} /></main>
      )}
      {route.name === "grammar" && (
        <main className="page"><GrammarLibrary onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "pronunciation" && (
        <main className="page"><PronunciationGuide onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "settings" && (
        <main className="page"><Settings progress={progress} onChange={changeSettings} onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "vocab" && (
        <main className="page"><VocabLibrary progress={progress} onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "review" && (
        <main className="page"><ReviewSession progress={progress} onReview={reviewCard} onAnswered={recordAnswer}
          onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "reading" && (
        <main className="page"><ReadingLibrary progress={progress} onAnswered={recordAnswer} awardXP={awardXP}
          onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "dialogues" && (
        <main className="page"><DialogueLibrary progress={progress} onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "conjugation" && (
        <main className="page"><ConjugationTrainer onExit={() => setRoute({ name: "home" })} awardXP={awardXP} onAnswered={recordAnswer} /></main>
      )}
      {route.name === "phrasebook" && (
        <main className="page"><Phrasebook progress={progress} onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "culture" && (
        <main className="page"><CulturalNotes onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "mistakes" && (
        <main className="page"><MistakeTracker progress={progress} onExit={() => setRoute({ name: "home" })} onReview={reviewCard} onAnswered={recordAnswer} /></main>
      )}

      <footer className="bottom">French with Halle · signed in as {user.name} · <em>bon courage</em></footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
