const VOCAB_FLAT = Object.entries(VOCAB).flatMap(([theme, words]) =>
  words.map((w, i) => ({ ...w, theme, id: theme.toLowerCase().replace(/[^a-z]/g, "") + "-" + i }))
);
// Definite article from gender. Handles elision before a vowel sound.
const VOWELISH = /^[aeiouàâäéèêëîïôöùûüÿh]/i;
function articleFor(w) {
  if (!w || w.g == null) return ""; // not a noun
  if (VOWELISH.test(w.fr)) return "l'";
  return w.g === "f" ? "la " : "le ";
}
// The word as it should be spoken/shown WITH its article (nouns only).
const withArticle = (w) => (w.g == null ? w.fr : articleFor(w) + w.fr);

// ============================================================
//  SPACED REPETITION ENGINE  (active recall + expanding intervals)
//  Each card's memory state lives in progress.srs[wordId]:
//    { ease, interval (days), due (dayIdx), reps, lapses }
//  A Leitner/SM-2-lite scheme: rating the recall (again/hard/good/easy)
//  moves the card to a longer or shorter interval. Due cards surface
//  first; new cards fill the rest of the session.
// ============================================================
const SRS_RATINGS = { again: 0, hard: 1, good: 2, easy: 3 };
function scheduleCard(card, rating, today) {
  // card: existing srs state or undefined (new card)
  const c = card || { ease: 2.3, interval: 0, due: today, reps: 0, lapses: 0 };
  let { ease, interval, reps, lapses } = c;
  if (rating === 0) {            // again — reset, see again today
    lapses += 1; interval = 0; ease = Math.max(1.3, ease - 0.2);
  } else {
    reps += 1;
    if (rating === 1) { ease = Math.max(1.3, ease - 0.15); interval = interval === 0 ? 1 : Math.max(1, Math.round(interval * 1.2)); }
    else if (rating === 2) { interval = interval === 0 ? 1 : Math.round(interval * ease); }
    else { ease = ease + 0.15; interval = interval === 0 ? 2 : Math.round(interval * ease * 1.3); }
  }
  interval = Math.min(interval, 365);
  return { ease, interval, due: today + interval, reps, lapses };
}
// Pick the cards for a review session of size n.
function dueCards(srs, today, n) {
  const due = [], fresh = [];
  VOCAB_FLAT.forEach((w) => {
    const st = srs[w.id];
    if (!st) fresh.push(w);
    else if (st.due <= today) due.push({ w, due: st.due });
  });
  due.sort((a, b) => a.due - b.due);
  const out = due.map((x) => x.w);
  for (const w of fresh) { if (out.length >= n) break; out.push(w); }
  return out.slice(0, n);
}
// How many cards are due right now (for badges).
function countDue(srs, today) {
  let n = 0;
  VOCAB_FLAT.forEach((w) => { const st = srs[w.id]; if (!st || st.due <= today) n++; });
  return n;
}

// Loose check: ignore accents/punctuation/case. Used when strictAccents is off.
const normLoose = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9' ]/g, "").replace(/\s+/g, " ").trim();
// Strict check: keep accents, still ignore case/punctuation.
const normStrict = (s) => (s || "").toLowerCase().replace(/[^a-zà-ÿ0-9' ]/gi, "").replace(/\s+/g, " ").trim();
const norm = (s) => (LIVE.strictAccents ? normStrict(s) : normLoose(s));
const dayIdx = () => Math.floor((Date.now() - new Date(2024, 0, 1)) / 864e5);
const shuffle = (a) => [...a].sort(() => Math.random() - 0.5);

// Return the French voices the user's device offers (France + other regions).
function frenchVoices() {
  try {
    const all = speechSynthesis.getVoices() || [];
    return all.filter((v) => /^fr(-|_|$)/i.test(v.lang) || /fr-/i.test(v.lang));
  } catch (e) { return []; }
}

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    u.rate = LIVE.audioSpeed === "slow" ? 0.6 : LIVE.audioSpeed === "fast" ? 1.05 : 0.88;
    u.pitch = LIVE.pitch || 1;
    // pick the chosen voice if it's still available
    if (LIVE.voiceURI) {
      const v = frenchVoices().find((x) => x.voiceURI === LIVE.voiceURI);
      if (v) u.voice = v;
    }
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- EXERCISE ENGINE ----------
function Exercise({ item, onResult }) {
  const [val, setVal] = useState("");
  const [picked, setPicked] = useState(null);
  const [order, setOrder] = useState([]);
  const [pool, setPool] = useState(() => (item.k === "build" ? shuffle(item.tiles) : []));
  const [status, setStatus] = useState("idle"); // idle | right | wrong
  const inp = useRef(null);

  useEffect(() => {
    setVal(""); setPicked(null); setOrder([]); setStatus("idle");
    setPool(item.k === "build" ? shuffle(item.tiles) : []);
    if (item.k === "listen") setTimeout(() => speak(item.a), 350);
    setTimeout(() => inp.current && inp.current.focus(), 60);
  }, [item]);

  const settle = (ok) => { setStatus(ok ? "right" : "wrong"); if (ok) speak(item.a); onResult(ok); };

  const submit = () => {
    if (status !== "idle") return;
    if (item.k === "choice") { if (picked == null) return; settle(picked === item.a); }
    else if (item.k === "build") { settle(order.join(" ") === item.a); }
    else { settle(norm(val) === norm(item.a)); }
  };

  const tag = { flashcard: "Learn", translate: "Translate", choice: "Choose", build: "Word order", listen: "Listening", conjugate: "Conjugate", cloze: "Fill the blank" }[item.k];

  // cloze: split the sentence on the ___ marker so we can drop an input inline
  const clozeParts = item.k === "cloze" ? item.q.split("___") : null;

  return (
    <div className="ex">
      <div className="ex-tagrow">
        <span className="ex-tag">{tag}</span>
        {item.verb && <span className="ex-verb">{item.verb}</span>}
      </div>

      {item.k === "listen" ? (
        <div className="listen-q">
          <button className="replay" onClick={() => speak(item.a)}>
            <Speaker text={item.a} big /> Replay audio
          </button>
        </div>
      ) : item.k === "cloze" ? (
        <div className="cloze-wrap">
          <p className="cloze-hint">Fill in the blank{item.note ? ` · ${item.note}` : ""}</p>
          <div className="cloze-sentence">
            <span>{clozeParts[0]}</span>
            <input ref={inp} className={`cloze-blank ${status}`} value={val}
              placeholder="…" disabled={status !== "idle"}
              onChange={(e) => setVal(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()} />
            <span>{clozeParts[1]}</span>
          </div>
          {item.en && <p className="cloze-en">“{item.en}”</p>}
        </div>
      ) : (
        <h3 className="ex-q">{item.q}{item.subj && <em> · subject: {item.subj}</em>}</h3>
      )}

      {item.k === "choice" && (
        <div className="opts">
          {item.opts.map((o) => (
            <button key={o}
              className={`opt ${picked === o ? "sel" : ""} ${status !== "idle" && o === item.a ? "correct" : ""} ${status === "wrong" && picked === o ? "bad" : ""}`}
              disabled={status !== "idle"}
              onClick={() => setPicked(o)}>{o}</button>
          ))}
        </div>
      )}

      {item.k === "build" && (
        <>
          <div className="build-line">
            {order.length === 0 && <span className="build-ph">Tap the words in order…</span>}
            {order.map((w, i) => (
              <button key={i} className="tile placed" disabled={status !== "idle"}
                onClick={() => { setOrder(order.filter((_, j) => j !== i)); setPool([...pool, w]); }}>{w}</button>
            ))}
          </div>
          <div className="build-pool">
            {pool.map((w, i) => (
              <button key={i} className="tile" disabled={status !== "idle"}
                onClick={() => { setOrder([...order, w]); setPool(pool.filter((_, j) => j !== i)); }}>{w}</button>
            ))}
          </div>
        </>
      )}

      {(item.k === "translate" || item.k === "conjugate" || item.k === "listen") && (
        <input ref={inp} className={`field ${status}`} value={val}
          placeholder={item.k === "conjugate" ? "verb form…" : "ta réponse…"}
          disabled={status !== "idle"}
          onChange={(e) => setVal(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
      )}

      {status === "idle" ? (
        <button className="cta" onClick={submit}>Check answer</button>
      ) : (
        <div className={`verdict ${status}`}>
          <span>
            {status === "right" ? "Correct — " : "Answer: "}
            <strong>{item.a}</strong> <Speaker text={item.a} />
          </span>
        </div>
      )}
    </div>
  );
}

// ---------- UNIT (lesson flow) ----------
function Unit({ unit, onBack, onComplete, awardXP, onAnswered, autoAdvance }) {
  const [stage, setStage] = useState("study"); // study | drill | done
  const [vi, setVi] = useState(0);
  const [reveal, setReveal] = useState(false);
  const seq = useMemo(() => shuffle(unit.ex), [unit.id]);
  const [ei, setEi] = useState(0);
  const [correct, setCorrect] = useState(0);
  const [streak, setStreak] = useState(0);

  useEffect(() => { setStage("study"); setVi(0); setReveal(false); setEi(0); setCorrect(0); setStreak(0); }, [unit.id]);

  const card = unit.vocab[vi];
  const exItem = seq[ei];

  const handleResult = (ok) => {
    if (ok) { setCorrect((c) => c + 1); setStreak((s) => s + 1); awardXP(10 + Math.min(streak, 5) * 2); }
    else setStreak(0);
    onAnswered && onAnswered();
    if (ok && autoAdvance) setTimeout(() => advanceEx(), 750);
  };

  const advanceEx = () => {
    if (ei + 1 < seq.length) setEi(ei + 1);
    else { const score = Math.round((correct / seq.length) * 100); onComplete(unit.id, score); awardXP(40); setStage("done"); }
  };

  return (
    <div className="unit">
      <button className="back" onClick={onBack}>← All lessons</button>
      <div className="unit-banner">
        <span className="lvtag">{unit.level}</span>
        <h2>{unit.title}</h2>
        <p>{unit.focus}</p>
      </div>

      <div className="steps">
        <span className={stage === "study" ? "on" : ""}>1 · Study</span>
        <span className={stage === "drill" ? "on" : ""}>2 · Drill</span>
        <span className={stage === "done" ? "on" : ""}>3 · Result</span>
      </div>

      {stage === "study" && (
        <>
          <div className="grammar">
            <span className="g-label">Grammar</span>
            <h4>{unit.grammar.t}</h4>
            <p>{unit.grammar.b}</p>
          </div>
          <div className={`vcard ${reveal ? "rev" : ""}`} onClick={() => setReveal((r) => !r)}>
            <Speaker text={card.fr} big />
            <h3>{card.fr}</h3>
            <p className="ipa">/{card.ipa}/</p>
            <p className="vmean">{reveal ? card.en : "Tap to reveal meaning"}</p>
          </div>
          <div className="vnav">
            <button className="ghost" disabled={vi === 0} onClick={() => { setVi(vi - 1); setReveal(false); }}>← Prev</button>
            <span className="counter">{vi + 1} / {unit.vocab.length}</span>
            {vi + 1 < unit.vocab.length
              ? <button className="ghost" onClick={() => { setVi(vi + 1); setReveal(false); }}>Next →</button>
              : <button className="cta sm" onClick={() => setStage("drill")}>Start drill →</button>}
          </div>
        </>
      )}

      {stage === "drill" && (
        <>
          <div className="drill-top">
            <div className="bar"><div className="bar-f" style={{ width: `${(ei / seq.length) * 100}%` }} /></div>
            <span className="counter">Q{ei + 1}/{seq.length} · 🔥{streak}</span>
          </div>
          <Exercise key={ei} item={exItem} onResult={handleResult} />
          <button className="cta ghostnext" onClick={advanceEx}>
            {ei + 1 < seq.length ? "Next question →" : "See result →"}
          </button>
        </>
      )}

      {stage === "done" && (
        <div className="result">
          <div className="score-ring" style={{ "--p": Math.round((correct / seq.length) * 100) }}>
            <span>{Math.round((correct / seq.length) * 100)}%</span>
          </div>
          <h2>{correct === seq.length ? "Sans faute ! 🏅" : correct >= seq.length * 0.6 ? "Bien joué !" : "Keep going!"}</h2>
          <p>You got {correct} of {seq.length} correct and earned XP for this unit.</p>
          <div className="result-btns">
            <button className="ghost" onClick={() => { setStage("study"); setVi(0); setEi(0); setCorrect(0); }}>Review again</button>
            <button className="cta sm" onClick={onBack}>Back to path</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- CHALLENGE MODE ----------
function Challenge({ onExit, awardXP, onFinish, onAnswered }) {
  const pool = useMemo(() => shuffle(allUnits.flatMap((u) => u.ex.filter((e) => e.k !== "flashcard"))).slice(0, 12), []);
  const [i, setI] = useState(0);
  const [lives, setLives] = useState(3);
  const [score, setScore] = useState(0);
  const [over, setOver] = useState(false);
  const [recorded, setRecorded] = useState(false);

  useEffect(() => {
    if (over && !recorded) { onFinish && onFinish(score); setRecorded(true); }
  }, [over, recorded, score, onFinish]);

  const onResult = (ok) => {
    if (ok) { setScore((s) => s + 1); awardXP(15); }
    else { setLives((l) => l - 1); }
    onAnswered && onAnswered();
  };
  const next = () => {
    if (lives <= 0) return;
    if (i + 1 < pool.length) setI(i + 1); else setOver(true);
  };
  useEffect(() => { if (lives <= 0) setOver(true); }, [lives]);

  if (over) {
    return (
      <div className="unit">
        <div className="result">
          <h2>{lives <= 0 ? "Game over" : "Défi terminé !"}</h2>
          <p className="big-score">{score}<span> pts</span></p>
          <p>{score >= 9 ? "Exceptional — that's near-fluent reflexes." : score >= 5 ? "Solid run. Push for the high score." : "Every champion starts somewhere."}</p>
          <button className="cta sm" onClick={onExit}>Return home</button>
        </div>
      </div>
    );
  }

  return (
    <div className="unit">
      <button className="back" onClick={onExit}>← Quit challenge</button>
      <div className="ch-hud">
        <span className="hearts">{"♥".repeat(lives)}<span className="dim">{"♡".repeat(3 - lives)}</span></span>
        <span className="ch-score">Score {score}</span>
        <span className="counter">{i + 1}/{pool.length}</span>
      </div>
      <div className="ch-tag">CHALLENGE · mixed levels · no hints</div>
      <Exercise key={i} item={pool[i]} onResult={onResult} />
      <button className="cta ghostnext" onClick={next}>Continue →</button>
    </div>
  );
}

// ---------- DAILY GOAL + STREAK CALENDAR (home widget) ----------
const DAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function DailyGoalCard({ progress, onChangeGoal, onPractise }) {
  const today = dayIdx();
  const count = progress.todayDay === today ? (progress.todayCount || 0) : 0;
  const goal = progress.dailyGoal || 20;
  const pct = Math.min(100, Math.round((count / goal) * 100));
  // Build the current week (Sun..Sat) around today
  const todayDate = new Date();
  const dow = todayDate.getDay(); // 0=Sun
  const week = DAY_LABELS.map((lab, i) => {
    const offset = i - dow;            // days from today
    const dIdx = today + offset;
    const done = (progress.history && progress.history[dIdx]) || (dIdx === today ? count : 0);
    const goalHit = done >= goal;
    return { lab, dIdx, done, goalHit, isToday: offset === 0, future: offset > 0 };
  });
  const goalOptions = [10, 20, 30, 40];
  const hit = count >= goal;
  return (
    <section className="goal-card">
      <div className="goal-top">
        <div>
          <p className="goal-kicker">Today's goal {hit ? "· done! 🎉" : ""}</p>
          <p className="goal-count"><b>{count}</b> / {goal} answers today</p>
        </div>
        <div className="goal-ring" style={{ "--p": pct }}>
          <span>{pct}%</span>
        </div>
      </div>
      <div className="goal-week">
        {week.map((d) => (
          <div key={d.lab} className={`gd ${d.goalHit ? "hit" : ""} ${d.isToday ? "today" : ""} ${d.future ? "future" : ""}`}>
            <div className="gd-box">{d.goalHit ? "✓" : d.done > 0 ? "·" : ""}</div>
            <span>{d.lab}</span>
          </div>
        ))}
      </div>
      <div className="goal-set">
        <span>Daily target:</span>
        {goalOptions.map((g) => (
          <button key={g} className={`goal-opt ${goal === g ? "on" : ""}`} onClick={() => onChangeGoal(g)}>{g}</button>
        ))}
      </div>
      <button className="goal-go" onClick={onPractise}>{hit ? "Keep practising →" : "Practise now →"}</button>
    </section>
  );
}

function Settings({ progress, onChange, onExit }) {
  const s = progress.settings || {};
  const [voices, setVoices] = useState(() => frenchVoices());

  // voices load asynchronously in many browsers — listen for them
  useEffect(() => {
    const load = () => setVoices(frenchVoices());
    load();
    try { speechSynthesis.addEventListener("voiceschanged", load); } catch (e) {}
    const t = setTimeout(load, 400); // fallback for engines that don't fire the event
    return () => { try { speechSynthesis.removeEventListener("voiceschanged", load); } catch (e) {} clearTimeout(t); };
  }, []);

  const Toggle = ({ on, set }) => (
    <button className={`toggle ${on ? "on" : ""}`} onClick={() => set(!on)} role="switch" aria-checked={on}>
      <span className="knob" />
    </button>
  );

  // Friendly, non-technical labels. Device voice names are cryptic, so we show
  // "Voice 1, Voice 2…" with the region as a subtitle.
  const regionOf = (v) => /ca/i.test(v.lang) ? "Canadian French" : /ch/i.test(v.lang) ? "Swiss French" : /be/i.test(v.lang) ? "Belgian French" : "French (France)";

  // play a sample WITHOUT changing the saved choice
  const sample = (voiceURI) => {
    const prevURI = LIVE.voiceURI, prevPitch = LIVE.pitch;
    LIVE.voiceURI = voiceURI; LIVE.pitch = s.pitch || 1;
    speak("Bonjour ! Voici ma voix.");
    // restore live state to the saved selection after sampling
    LIVE.voiceURI = s.voiceURI || null; LIVE.pitch = prevPitch;

  const choose = (voiceURI) => { onChange({ ...s, voiceURI }); LIVE.voiceURI = voiceURI; speak("Bonjour ! Voici ma voix."); };

  return (
    <div className="unit">
      <button className="back" onClick={onExit}>← Home</button>

                <div className="voice-meta">

                  <span className="voice-sub">Your device's standard French</span>
                </div>
                <button className="voice-hear" onClick={() => sample(null)}>▶ Hear</button>
                {!s.voiceURI ? <span className="voice-using">In use</span>
                  : <button className="voice-use" onClick={() => choose(null)}>Use</button>}
              </div>
              {voices.map((v, i) => {
                const selected = s.voiceURI === v.voiceURI;
                return (

                    {selected ? <span className="voice-using">In use</span>
                      : <button className="voice-use" onClick={() => choose(v.voiceURI)}>Use</button>}

        <div className="set-row col">
          <div className="set-head"><b>Voice pitch</b><span>Lower for a deeper voice, higher for a brighter one.</span></div>
          <div className="seg">
            {[["Low", 0.7], ["Normal", 1], ["High", 1.3]].map(([lab, p]) => (

// ---------- SPACED-REPETITION REVIEW SESSION ----------
// Active recall: see the English (or hear the French), try to recall, flip,
// then rate yourself. The rating schedules when you'll see it next.
function ReviewSession({ progress, onExit, onReview, onAnswered, goalCount, goalTarget }) {
  const today = dayIdx();
  const session = useMemo(() => dueCards(progress.srs || {}, today, Math.max(10, progress.dailyGoal || 20)), []);
  const [i, setI] = useState(0);
  const [flip, setFlip] = useState(false);
  const [done, setDone] = useState(session.length === 0);
  const [reviewed, setReviewed] = useState(0);
  const w = session[i];

  useEffect(() => { if (w) setTimeout(() => speak(withArticle(w)), 250); setFlip(false); }, [i]);

  const rate = (ratingKey) => {
    const rating = SRS_RATINGS[ratingKey];
    onReview(w.id, rating);          // schedule the card
    onAnswered && onAnswered();      // count toward today's goal
    setReviewed((n) => n + 1);
    if (i + 1 < session.length) setI(i + 1);
    else setDone(true);
  };

  if (done) {
    return (
      <div className="unit">
        <button className="back" onClick={onExit}>← Home</button>
        <div className="result">
          <div className="score-ring" style={{ "--p": 100 }}><span>{reviewed}</span></div>

          <p>{reviewed === 0
            ? "No cards are due right now. Come back later, or browse the flashcard library to add new words."
            : `You reviewed ${reviewed} word${reviewed > 1 ? "s" : ""}. They'll come back at just the right time to stick.`}</p>
          <button className="cta sm" onClick={onExit}>Back to home</button>
        </div>
      </div>
    );
  }

  return (
    <div className="unit">
      <button className="back" onClick={onExit}>← Home</button>
      <div className="unit-banner">
        <span className="lvtag">Spaced repetition</span>
        <h2>Review</h2>

            <h2 className="fc-word">{withArticle(w)}</h2>

            {!flip && <p className="fc-hint">Think… then tap to reveal</p>}
          </div>
          <div className="fc-face fc-back">
            <h2 className="fc-en">{w.en}</h2>
            {w.g && <p className="fc-art">{articleFor(w).trim() || "l'"} · {w.g === "f" ? "feminine" : "masculine"}</p>}
          </div>
        </div>

      {flip ? (
        <div className="srs-rate">

  );
}

function ReadingPassage({ passage, onBack, onAnswered, awardXP }) {
  const [showEn, setShowEn] = useState(false);
  const [stage, setStage] = useState("read"); // read | quiz | done
  const [qi, setQi] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const q = passage.questions[qi];
  const opts = useMemo(() => (q ? shuffle(q.opts) : []), [qi, stage]);

  const answer = (opt) => {
    if (picked != null) return;
    setPicked(opt);
    const right = opt === q.a;
    if (right) { setScore((s) => s + 1); awardXP && awardXP(5); }
    onAnswered && onAnswered();
    setTimeout(() => {
      if (qi + 1 < passage.questions.length) { setQi(qi + 1); setPicked(null); }
      else setStage("done");
    }, 850);
  };

  if (stage === "done") {
    const pct = Math.round((score / passage.questions.length) * 100);
    return (
      <div className="unit">
        <button className="back" onClick={onBack}>← All passages</button>
        <div className="result">
          <div className="score-ring" style={{ "--p": pct }}><span>{pct}%</span></div>
          <h2>{pct >= 67 ? "Bien lu ! 📖" : "Keep practising 💪"}</h2>
          <p>You got {score} of {passage.questions.length} right. Re-read the text any time to sharpen comprehension.</p>
          <button className="cta sm" onClick={onBack}>Back to passages</button>
        </div>
      </div>
    );
  }

  return (
    <div className="unit">
      <button className="back" onClick={onBack}>← All passages</button>
      <div className="unit-banner">
        <span className="lvtag">{passage.level} · Reading</span>
        <h2>{passage.title}</h2>
      </div>

      {stage === "read" && (
        <>
          <div className="read-text">
            <p className="rt-fr">{passage.text}</p>
            <button className="rt-speak" onClick={() => speak(passage.text)}>🔊 Hear the passage</button>
            <button className="rt-toggle" onClick={() => setShowEn((v) => !v)}>{showEn ? "Hide" : "Show"} English</button>
            {showEn && <p className="rt-en">{passage.en}</p>}
          </div>
          <button className="cta wide" onClick={() => setStage("quiz")}>I've read it — quiz me →</button>
        </>
      )}

      {stage === "quiz" && q && (
        <div className="rq">
          <div className="drill-top">
            <div className="bar"><div className="bar-f" style={{ width: `${(qi / passage.questions.length) * 100}%` }} /></div>
            <span className="counter">{qi + 1}/{passage.questions.length}</span>
          </div>
          <p className="rq-q">{q.q}</p>
          <div className="rq-opts">
            {opts.map((o) => {
              const cls = picked == null ? "" : o === q.a ? "right" : o === picked ? "wrong" : "dim";
              return <button key={o} className={`rq-opt ${cls}`} onClick={() => answer(o)}>{o}</button>;
            })}
          </div>
          <button className="rt-toggle" onClick={() => setStage("read")}>← Re-read the text</button>
        </div>
      )}
    </div>
  );
}

// ---------- CONJUGATION TRAINER ----------
const SUBJECTS = ["je", "tu", "il/elle", "nous", "vous", "ils/elles"];
const FORM_KEYS = ["je", "tu", "il", "nous", "vous", "ils"];

function ConjugationTrainer({ onExit, awardXP, onAnswered }) {
  const tenses = [...new Set(CONJUGATIONS.map(c => c.tense))];
  const [tense, setTense] = useState(tenses[0]);
  const filtered = CONJUGATIONS.filter(c => c.tense === tense);
  const [idx, setIdx] = useState(0);
  const [inputs, setInputs] = useState({});
  const [checked, setChecked] = useState(false);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const conj = filtered[idx] || filtered[0];

  useEffect(() => { setInputs({}); setChecked(false); }, [idx, tense]);

  const check = () => {
    if (checked) return;
    let right = 0;
    FORM_KEYS.forEach(k => { if (norm(inputs[k] || "") === norm(conj.forms[k])) right++; });
    setScore(s => ({ right: s.right + right, total: s.total + 6 }));
    setChecked(true);
    if (right > 0) { awardXP && awardXP(right * 3); onAnswered && onAnswered(); }
    speak(conj.verb);
  };

  const next = () => { setIdx(i => (i + 1) % filtered.length); };

  return (
    <div className="unit">
      <button className="back" onClick={onExit}>← Home</button>
      <div className="unit-banner">
        <span className="lvtag">Premium · Conjugation</span>
        <h2>Conjugation trainer</h2>
        <p>Fill all 6 forms. Your memory builds the pattern — not reading a table.</p>
      </div>
      <div className="conj-tabs">
        {tenses.map(t => <button key={t} className={`conj-tab ${tense === t ? "on" : ""}`} onClick={() => { setTense(t); setIdx(0); }}>{t}</button>)}
      </div>
      <div className="conj-card">
        <div className="conj-verb">
          <span className="conj-inf">{conj.verb}</span>
          <span className="conj-meaning">{conj.meaning}</span>
          <span className="conj-tense">{conj.tense}</span>
          <button className="fc-say" onClick={() => speak(conj.verb)}>🔊</button>
        </div>
        <div className="conj-grid">
          {FORM_KEYS.map((k, i) => {
            const correct = checked && norm(inputs[k] || "") === norm(conj.forms[k]);
            const wrong = checked && !correct;
            return (
              <div key={k} className={`conj-row ${checked ? (correct ? "right" : "wrong") : ""}`}>
                <span className="conj-subj">{SUBJECTS[i]}</span>
                <input className="conj-input" value={inputs[k] || ""} placeholder="…"
                  readOnly={checked}
                  onChange={e => setInputs(p => ({ ...p, [k]: e.target.value }))}
                  onKeyDown={e => e.key === "Enter" && check()} />
                {wrong && <span className="conj-ans">{conj.forms[k]}</span>}
              </div>
            );
          })}
        </div>
        {!checked
          ? <button className="cta wide" onClick={check}>Check answers</button>
          : <button className="cta wide" onClick={next}>Next verb →</button>}
        {score.total > 0 && <p className="conj-score">Session: {score.right}/{score.total} correct</p>}
      </div>
      <div className="conj-list">
        <h3>Verbs in this tense</h3>
        {filtered.map((c, i) => (
          <button key={i} className={`conj-verb-btn ${i === idx ? "on" : ""}`} onClick={() => setIdx(i)}>
            <b>{c.verb}</b><span>{c.meaning}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------- MISTAKE TRACKER ----------
function MistakeTracker({ progress, onExit, onReview, onAnswered }) {
  const mistakes = progress.mistakes || {};
  const wordIds = Object.keys(mistakes).sort((a, b) => (mistakes[b] || 0) - (mistakes[a] || 0));
  const [mode, setMode] = useState("list"); // list | drill
  const [i, setI] = useState(0);
  const [flip, setFlip] = useState(false);

  if (wordIds.length === 0) {
    return (
      <div className="unit">
        <button className="back" onClick={onExit}>← Home</button>
        <div className="unit-banner"><span className="lvtag">Premium · Review</span><h2>Weak spots</h2></div>
        <div className="result"><h2>No mistakes yet! 🎉</h2><p>Complete some drills first — your weak spots will appear here so you can target them.</p></div>
      </div>
    );
  }

  const words = wordIds.map(id => VOCAB_FLAT.find(w => w.id === id)).filter(Boolean).slice(0, 30);

  if (mode === "drill" && words.length > 0) {
    const w = words[i];
    return (
      <div className="unit">
        <button className="back" onClick={() => { setMode("list"); setI(0); setFlip(false); }}>← List</button>
        <div className="unit-banner"><span className="lvtag">Weak spots drill</span><h2>{words.length} words to fix</h2></div>
        <div className="drill-top">
          <div className="bar"><div className="bar-f" style={{ width: `${(i / words.length) * 100}%` }} /></div>
          <span className="counter">{i + 1}/{words.length}</span>
        </div>
        <div className={`flashcard ${flip ? "flip" : ""}`} onClick={() => setFlip(true)}>
          <div className="fc-inner">
            <div className="fc-face fc-front">
              <h2 className="fc-word">{withArticle(w)}</h2>
              <button className="fc-say" onClick={e => { e.stopPropagation(); speak(withArticle(w)); }}>🔊 Hear</button>
              {!flip && <p className="fc-hint">Recall… then tap to reveal</p>}
            </div>
            <div className="fc-face fc-back">
              <h2 className="fc-en">{w.en}</h2>
              {w.g && <p className="fc-art">{articleFor(w).trim()} · {w.g === "f" ? "feminine" : "masculine"}</p>}
            </div>
          </div>
        </div>
        {flip ? (
          <div className="srs-rate">
            <p className="srs-q">Did you know it?</p>
            <div className="srs-btns">
              {[["again","Again"],["hard","Hard"],["good","Good"],["easy","Easy"]].map(([k,lab]) => (
                <button key={k} className={`srs-btn ${k}`} onClick={() => { onReview(w.id, SRS_RATINGS[k]); onAnswered && onAnswered(); if(i+1<words.length){setI(i+1);setFlip(false);}else setMode("done"); }}>{lab}</button>
              ))}
            </div>
          </div>
        ) : <button className="cta wide" onClick={() => setFlip(true)}>Reveal</button>}
      </div>
    );
  }

  return (
    <div className="unit">
      <button className="back" onClick={onExit}>← Home</button>
      <div className="unit-banner"><span className="lvtag">Premium · Review</span><h2>Your weak spots</h2>
        <p>Words you've gotten wrong most often — target these and you'll improve fastest.</p>
      </div>
      <button className="cta" onClick={() => setMode("drill")}>Drill my weak spots →</button>
      <div className="mistake-list">
        {words.map(w => (
          <div key={w.id} className="mistake-row">
            <div>
              <b>{withArticle(w)}</b> <span className="ms-en">{w.en}</span>
            </div>
            <span className="ms-count">✗ {mistakes[w.id]}×</span>
            <button className="fc-say sm" onClick={() => speak(withArticle(w))}>🔊</button>
          </div>
        ))}
      </div>
    </div>
  );
}

.page{max-width:760px}

.hero{padding:20px 0 36px;border-bottom:1px solid var(--line);margin-bottom:34px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rouge);font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.05;max-width:760px}
.hero h1 span{color:var(--bleu)}
.lede{color:var(--soft);font-size:17px;max-width:580px;margin:20px 0 24px;line-height:1.55}
.hero-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.hero-prog{display:flex;align-items:center;gap:14px}
.hp-bar{flex:1;max-width:340px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.hp-bar div{height:100%;background:linear-gradient(90deg,var(--vert),var(--or));transition:width .6s}
.hero-prog span{font-size:13px;color:var(--soft)}

.cta{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:11px;
  padding:13px 22px;font-weight:600;font-size:15px;transition:transform .14s,background .2s}
.cta:hover{transform:translateY(-2px);background:var(--rouge);border-color:var(--rouge)}
.cta:disabled{opacity:.6;transform:none;cursor:default}
.cta.outline{background:transparent;color:var(--ink)}
.cta.outline:hover{background:var(--ink);color:var(--paper)}
.cta.sm{padding:11px 18px;font-size:14px}
.cta.done{background:var(--vert);border-color:var(--vert)}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 18px;font-weight:600;font-size:14px;transition:.15s}
.ghost:hover:not(:disabled){border-color:var(--ink)}
.ghost:disabled{opacity:.4;cursor:default}
.ghostnext{margin-top:16px;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ghostnext:hover{border-color:var(--ink);background:var(--card);transform:none}

.levels{display:flex;flex-direction:column;gap:14px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:box-shadow .2s}
.lvl.open{box-shadow:var(--shadow)}
.lvl-head{width:100%;display:flex;align-items:center;gap:18px;padding:20px 22px;background:none;border:none;text-align:left}
.badge{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  font-family:'Fraunces',serif;font-size:18px;background:var(--bleu);color:#fff}
.lvl:nth-child(2) .badge{background:var(--vert)}
.lvl:nth-child(3) .badge{background:var(--or)}
.lvl:nth-child(4) .badge{background:var(--rouge)}
.lvl:nth-child(5) .badge{background:var(--ink)}
.lvl-meta{flex:1}
.lvl-meta h2{font-size:21px}
.lvl-meta p{font-size:13px;color:var(--soft);margin-top:3px}
.lvl-side{display:flex;align-items:center;gap:14px}
.lvl-frac{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.chev{font-size:22px;color:var(--soft);width:20px;text-align:center}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:0 18px 20px}
.unit-card{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px;
  display:flex;flex-direction:column;gap:7px;transition:transform .16s,border-color .16s;opacity:0;animation:rise .45s forwards}
.unit-card:hover{transform:translateY(-3px);border-color:var(--ink)}
.uc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.uc-head h3{font-size:17px;line-height:1.2}
.uc-score{font-size:12px;font-weight:700;color:var(--vert);background:#e7efe8;padding:2px 8px;border-radius:99px;white-space:nowrap}
.uc-score.perfect{color:#fff;background:var(--or)}
.uc-focus{font-size:13px;color:var(--soft)}
.uc-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-top:4px}
.uc-go{color:var(--rouge);font-weight:600}

.back{background:none;border:none;color:var(--rouge);font-weight:600;font-size:14px;margin-bottom:18px}
.unit-banner{margin-bottom:22px}
.lvtag{font-size:12px;letter-spacing:.1em;color:var(--soft);font-weight:600}
.unit-banner h2{font-size:30px;margin:5px 0 3px}
.unit-banner p{color:var(--soft)}
.steps{display:flex;gap:8px;margin-bottom:26px;font-size:12px;color:var(--soft)}
.steps span{padding:6px 13px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-weight:600}
.steps span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.grammar{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--bleu);
  border-radius:12px;padding:18px 20px;margin-bottom:20px}
.g-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bleu);font-weight:700}
.grammar h4{font-size:18px;margin:6px 0 8px}
.grammar p{font-size:14px;color:var(--soft);line-height:1.6}

.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:38px 24px;text-align:center;
  position:relative;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.vcard:hover{transform:translateY(-2px)}
.vcard h3{font-size:36px;margin-bottom:4px}
.ipa{color:var(--bleu);font-size:14px;font-family:'Spline Sans';margin-bottom:14px}
.vmean{color:var(--soft);font-size:16px;min-height:22px}
.vcard.rev .vmean{color:var(--ink);font-weight:600;font-family:'Fraunces',serif}
.vnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.counter{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}

.spk{background:var(--paper);border:1px solid var(--line);color:var(--rouge);border-radius:50%;
  width:30px;height:30px;display:inline-grid;place-items:center;transition:.15s;vertical-align:middle}
.spk:hover{background:var(--rouge);color:#fff}
.spk.big{width:42px;height:42px;position:absolute;top:16px;right:16px}
.daily-actions .spk.big,.listen-q .spk.big,.replay .spk.big{position:static}

.drill-top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.bar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-f{height:100%;background:var(--rouge);transition:width .4s}

.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.ex-tagrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ex-tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rouge);font-weight:700}
.ex-verb{font-size:12px;color:var(--soft);font-style:italic}
.ex-q{font-size:22px;line-height:1.3;margin-bottom:18px}
.ex-q em{font-size:14px;color:var(--soft);font-weight:400}
.listen-q{margin-bottom:18px}
.replay{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px dashed var(--bleu);
  color:var(--bleu);border-radius:12px;padding:16px 20px;font-weight:600;font-size:15px;width:100%;justify-content:center}

.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:11px;
  padding:14px 16px;font-size:15px;font-weight:500;color:var(--ink);transition:.13s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--bleu);background:#eef2f8}
.opt.correct{border-color:var(--vert);background:#e7efe8}
.opt.bad{border-color:var(--rouge);background:#f8e9e6}

.build-line{min-height:54px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed var(--line);
  border-radius:12px;margin-bottom:12px;align-items:center}
.build-ph{color:var(--soft);font-size:14px;font-style:italic}
.build-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tile{background:var(--paper);border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;font-size:15px;font-weight:600;transition:.12s}
.tile:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.tile.placed{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.field{width:100%;padding:15px 18px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
  font-family:inherit;font-size:17px;outline:none;margin-bottom:18px;transition:border-color .2s}
.field:focus{border-color:var(--bleu)}
.field.right{border-color:var(--vert);background:#e7efe8}
.field.wrong{border-color:var(--rouge);background:#f8e9e6}

.verdict{padding:14px 16px;border-radius:11px;font-size:15px}
.verdict span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.verdict.right{background:#e7efe8;color:var(--vert)}
.verdict.wrong{background:#f8e9e6;color:var(--rouge)}
.verdict strong{font-family:'Fraunces',serif}

.result{text-align:center;padding:20px 0}
.score-ring{--p:0;width:120px;height:120px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
  background:conic-gradient(var(--vert) calc(var(--p)*1%),var(--line) 0);position:relative}
.score-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--paper)}
.score-ring span{position:relative;font-family:'Fraunces',serif;font-size:30px}
.result h2{font-size:28px;margin-bottom:8px}
.result p{color:var(--soft);max-width:380px;margin:0 auto 22px}
.result-btns{display:flex;gap:12px;justify-content:center}
.big-score{font-family:'Fraunces',serif;font-size:64px;color:var(--rouge);margin:10px 0}
.big-score span{font-size:22px;color:var(--soft)}

.ch-hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hearts{color:var(--rouge);font-size:20px;letter-spacing:2px}
.hearts .dim{color:var(--line)}
.ch-score{font-weight:700}
.ch-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:18px}

.daily-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 28px;text-align:center;box-shadow:var(--shadow)}
.daily-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--or);font-weight:700}
.daily-fr{font-size:30px;line-height:1.25;margin:14px 0 18px;font-style:italic}
.daily-actions{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.daily-en{color:var(--soft);font-size:16px}

.bottom{text-align:center;color:var(--soft);font-size:13px;padding:24px;position:relative;z-index:1}

@keyframes rise{to{opacity:1;transform:translateY(0)}}
.unit-card{transform:translateY(12px)}

@media(max-width:600px){
  .top{padding:12px 16px}.main,main{padding:22px 16px 40px}
  .hero h1{font-size:30px}.units{grid-template-columns:1fr}
  .lvl-head{padding:16px}.ex{padding:18px}.ex-q{font-size:19px}
}

/* ===== LANDING / AUTH ===== */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;padding:30px 20px;text-align:center}
.land-inner{position:relative;z-index:1;max-width:520px;animation:rise .6s both}
.land-mark{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;margin:0 auto 22px;
.auth-loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--paper)}
.auth-loading p{color:var(--soft);font-size:15px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
  background:var(--rouge);color:#fff;font-family:'Fraunces',serif;font-size:40px;box-shadow:0 12px 30px rgba(193,67,43,.35)}
.eyebrow.center{text-align:center}
.land-title{font-size:clamp(38px,7vw,60px);line-height:1.0;margin:6px 0 16px}
.land-sub{color:var(--soft);font-size:17px;line-height:1.6;max-width:440px;margin:0 auto 30px}
.land-actions{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:0 auto}
.land-fine{font-size:12px;color:var(--soft);margin-top:6px}
.link-btn{background:none;border:none;color:var(--rouge);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.login-accounts{margin-bottom:10px}
.login-pick{font-size:13px;color:var(--soft);font-weight:600;margin-bottom:8px}
.login-acct{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;transition:.13s}
.login-acct:hover{border-color:var(--rouge);transform:translateY(-1px)}
.login-av{font-size:28px;flex-shrink:0}
.login-acct-meta{flex:1;min-width:0;display:flex;flex-direction:column}
.login-acct-meta b{font-size:15px}
.login-acct-meta span{font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login-go{color:var(--rouge);font-weight:700;font-size:18px}
.login-or{text-align:center;font-size:12px;color:var(--soft);margin:14px 0 4px;position:relative}
.land-form{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto;text-align:left}
.land-form label{font-size:13px;font-weight:600;color:var(--soft);margin-top:4px}
.land-form .field{margin-bottom:2px}
.textback{background:none;border:none;color:var(--soft);font-size:13px;margin-top:4px;align-self:center}
.land-foot{position:relative;z-index:1;margin-top:36px;color:var(--soft);font-size:13px}

/* welcome feature chips */
.land-feats{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.lf{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;min-width:96px}
.lf span{font-size:24px}
.lf p{font-size:11px;color:var(--soft);text-align:center;line-height:1.3}

/* registration form */
.form-step{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--rouge);font-weight:700;margin-bottom:4px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-2col label{margin-top:0}
.phone-row{display:flex;gap:8px}
.cc-select{flex-shrink:0;max-width:140px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-family:inherit;
  font-size:14px;padding:0 8px;outline:none;cursor:pointer;color:var(--ink);text-overflow:ellipsis}
.cc-select:focus{border-color:var(--bleu)}
.phone-row .field{flex:1;min-width:0;margin-bottom:0}
.field.bad{border-color:var(--rouge);background:#fdeeec}
.form-err{font-size:12px;color:var(--rouge);font-weight:600}

/* avatar picker */
.av-preview{font-size:64px;text-align:center;margin:4px 0 6px;height:74px;line-height:74px}
.av-tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:11px}
.av-tab{flex:1;border:none;background:none;padding:9px;border-radius:8px;font-family:inherit;font-weight:700;color:var(--soft);cursor:pointer;font-size:13px;transition:.13s}
.av-tab.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.av-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0}
.av-opt{aspect-ratio:1;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:26px;
  display:grid;place-items:center;cursor:pointer;transition:.13s}
.av-opt:hover{border-color:var(--ink);transform:translateY(-2px)}
.av-opt.on{border-color:var(--vert);border-width:2.5px;background:#f0fbf6}
.prof-avpick{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.prof-av-edit{position:absolute;right:-2px;bottom:-2px;background:var(--ink);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.prof-phone{font-size:12px;color:var(--soft);margin-top:1px}

/* ===== STREAK + AVATAR ===== */
.streakchip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-weight:700;font-size:14px}
.avatar-btn{background:none;border:none;padding:0}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  background:var(--card);border:2px solid var(--line);transition:.15s}
.avatar-btn:hover .avatar{border-color:var(--rouge);transform:scale(1.05)}

/* ===== LOCKED LEVELS + STARS ===== */
.lvl.locked{opacity:.85}
.lvl.locked .lvl-head{cursor:not-allowed}
.lvl.locked .badge{background:var(--line);color:var(--soft);font-size:20px}
.lock-msg{font-size:13px;color:var(--rouge);font-weight:600;margin-top:3px}
.lvl-code{font-family:'Spline Sans';font-size:12px;color:var(--soft);font-weight:600;letter-spacing:.06em}
.lvl-stars{font-size:12px;color:var(--or);font-weight:700;white-space:nowrap}
.uc-stars{display:flex;gap:3px;font-size:15px;color:var(--line)}
.uc-stars span.on{color:var(--or)}
.uc-stars.dim{opacity:.5}

/* locked & taster unit cards */
.unit-card.uclocked{opacity:.7}
.unit-card.uclocked:hover{transform:none;border-color:var(--line)}
.uc-lock{font-size:14px}
.unit-card.uctaster{border-color:var(--vert);border-width:1.5px;background:linear-gradient(180deg,#f0fbf6,var(--paper))}
.uc-taster{background:var(--vert);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:99px}
.unit-card.uclocked .uc-go{color:var(--or)}
.unit-card.uctaster .uc-go{color:var(--vert);font-weight:700}

/* ===== PULSE on daily ===== */
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(199,154,58,.4)}50%{box-shadow:0 0 0 8px rgba(199,154,58,0)}}

/* ===== HERO PROG TWEAK ===== */
.hp-row{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-bottom:6px}
.hp-units{display:block;margin-top:6px}

/* ===== TOAST (unlock) ===== */
.toast{position:fixed;top:80px;left:0;right:0;z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast-in{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 22px;display:flex;align-items:center;gap:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.3);animation:drop .5s cubic-bezier(.2,1.4,.4,1) both;max-width:420px}
.toast-key{font-size:30px;animation:wiggle .6s ease 3}
.toast-in strong{font-family:'Fraunces',serif;font-size:18px;display:block}
.toast-in p{font-size:13px;opacity:.85;margin-top:2px}
@keyframes drop{from{transform:translateY(-80px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}

/* ===== MODAL / PROFILE ===== */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(31,27,22,.45);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s both}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px;max-width:460px;width:100%;
  position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:rise .35s both}
.modal-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:26px;color:var(--soft);line-height:1}
.prof-head{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.prof-av{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--card);border:2px solid var(--line);cursor:pointer;transition:.15s}
.prof-av:hover{border-color:var(--rouge)}
.prof-head h2{font-size:24px}
.prof-sub{color:var(--soft);font-size:13px;margin-top:2px}
.prof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.prof-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.prof-stat b{font-family:'Fraunces',serif;font-size:20px;display:block}
.prof-stat span{font-size:11px;color:var(--soft)}
.prof-best{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--soft);margin-bottom:18px}
.prof-best b{color:var(--ink);font-family:'Fraunces',serif}
.ghost.wide{width:100%}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===== PAYWALL / UPSELL ===== */
.upsell{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;
  background:linear-gradient(110deg,#2b2620,#3a2f25);color:var(--paper);border:1px solid #4a3d30;
  border-radius:16px;padding:18px 22px;margin-bottom:22px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.upsell:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(60,45,25,.25)}
.upsell-l{display:flex;align-items:center;gap:14px}
.upsell-badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(135deg,var(--or),var(--rouge));color:#fff;font-size:20px}
.upsell-l strong{font-family:'Fraunces',serif;font-size:18px;display:block}
.upsell-l p{font-size:13px;opacity:.8;margin-top:2px}
.upsell-cta{background:var(--or);color:#1f1b16;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;white-space:nowrap}

.lvl.paylock .badge{background:linear-gradient(135deg,var(--or),var(--rouge));color:#fff;font-size:20px}
.lvl.paylock .lvl-head{cursor:pointer}
.pay-msg{font-size:13px;color:var(--or);font-weight:700;margin-top:3px}
.pay-pill{background:var(--or);color:#1f1b16;font-weight:700;font-size:12px;padding:4px 11px;border-radius:99px;white-space:nowrap}

.paywall{text-align:center}
.pw-badge{display:inline-block;background:linear-gradient(135deg,var(--or),var(--rouge));color:#fff;font-weight:700;
  font-size:13px;letter-spacing:.06em;padding:6px 16px;border-radius:99px;margin-bottom:14px}
.pw-title{font-size:28px;margin-bottom:6px}
.pw-price{font-size:15px;color:var(--soft);margin-bottom:18px}
.pw-price b{font-family:'Fraunces',serif;font-size:40px;color:var(--ink);display:inline-block;margin-right:6px}
.pw-list{list-style:none;text-align:left;margin:0 auto 22px;max-width:320px;display:flex;flex-direction:column;gap:10px}
.pw-list li{padding-left:28px;position:relative;font-size:14px;color:var(--ink)}
.pw-list li::before{content:"✓";position:absolute;left:0;top:0;color:var(--vert);font-weight:800}
.buybtn{background:linear-gradient(135deg,var(--or),var(--rouge));border:none}
.buybtn:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--or),var(--rouge))}
.cta.wide{width:100%}
.pw-done{background:#e7efe8;color:var(--vert);font-weight:700;border-radius:12px;padding:15px;font-size:16px;margin-bottom:8px}
.pw-fine{font-size:11px;color:var(--soft);margin-top:12px}
.prof-plan{border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;text-align:center;
  background:var(--card);border:1px solid var(--line);color:var(--soft)}
.prof-plan.pro{background:linear-gradient(135deg,#fbf2dd,#f6e3c8);border-color:var(--or);color:#8a6d22}

/* ===== HEADER GEAR ===== */
.gear-btn{background:var(--card);border:1px solid var(--line);color:var(--soft);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;transition:.15s}
.gear-btn:hover{border-color:var(--ink);color:var(--ink)}

/* ===== DAILY GOAL CARD ===== */
.goal-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.goal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.goal-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700}
.goal-count{font-size:18px;margin-top:3px}
.goal-count b{font-family:'Fraunces',serif;font-size:26px}
.goal-ring{--p:0;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  background:conic-gradient(var(--vert) calc(var(--p)*1%),var(--line) 0);position:relative}
.goal-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.goal-ring span{position:relative;font-size:13px;font-weight:700}
.goal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.gd{display:flex;flex-direction:column;align-items:center;gap:6px}
.gd-box{width:100%;aspect-ratio:1;max-width:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);
  display:grid;place-items:center;font-size:16px;color:var(--soft);font-weight:700}
.gd.hit .gd-box{background:var(--vert);border-color:var(--vert);color:#fff}
.gd.today .gd-box{border-color:var(--rouge);border-width:2px}
.gd.future .gd-box{opacity:.45}
.gd span{font-size:11px;color:var(--soft)}
.goal-set{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal-set>span{font-size:13px;color:var(--soft)}
.goal-opt{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:700;color:var(--soft);transition:.13s}
.goal-opt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ===== REFERENCE CARDS (home) ===== */
.ref-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.ref-card{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;transition:transform .15s,border-color .15s}
.ref-card:hover{transform:translateY(-2px);border-color:var(--ink)}
.ref-emoji{font-size:28px}
.ref-card strong{font-family:'Fraunces',serif;font-size:16px;display:block}
.ref-card p{font-size:12px;color:var(--soft);margin-top:2px}

/* ===== GRAMMAR LIBRARY ===== */
.ref-tabs{display:flex;gap:8px;background:var(--line);padding:5px;border-radius:14px;margin-bottom:20px;max-width:380px}
.ref-tab{flex:1;border:none;background:none;padding:10px;border-radius:10px;font-family:inherit;font-weight:700;color:var(--soft);cursor:pointer;transition:.15s;font-size:14px}
.ref-tab.on{background:var(--card);color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.06)}
.ref-list{display:flex;flex-direction:column;gap:10px}
.ref-item{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:box-shadow .2s}
.ref-item.open{box-shadow:var(--shadow)}
.ref-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:none;
  padding:16px 18px;font-family:'Fraunces',serif;font-size:17px;color:var(--ink);text-align:left;cursor:pointer}
.ref-chev{font-size:22px;color:var(--soft);width:20px;text-align:center;flex-shrink:0}
.ref-a{padding:0 18px 18px;color:var(--soft);font-size:14px;line-height:1.65}

/* ===== PRONUNCIATION GUIDE ===== */
.pr-head{font-size:18px;margin:24px 0 12px}
.pr-table{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.pr-row{display:grid;grid-template-columns:64px 1fr 1.3fr;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.pr-row:last-child{border-bottom:none}
.pr-ipa{font-family:'Spline Sans';font-size:16px;font-weight:700;color:var(--bleu);background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer;transition:.13s}
.pr-ipa:hover{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.pr-like{font-size:14px}
.pr-ex{font-size:14px;color:var(--soft)}
.pr-tips{list-style:none;display:flex;flex-direction:column;gap:12px;padding:0}
.pr-tips li{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--or);border-radius:10px;
  padding:14px 16px;font-size:14px;color:var(--soft);line-height:1.6}
.pr-fine{text-align:center;color:var(--soft);font-size:12px;margin-top:16px}

/* ===== SETTINGS ===== */
.set-list{display:flex;flex-direction:column;gap:12px}
.set-row{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.set-row.col{flex-direction:column;align-items:stretch;gap:12px}
.set-head b{font-family:'Fraunces',serif;font-size:16px;display:block}
.set-head span{font-size:13px;color:var(--soft);margin-top:2px;display:block}
.toggle{width:52px;height:30px;border-radius:99px;background:var(--line);border:none;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--vert)}
.toggle .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .knob{left:25px}
.seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:11px}
.seg-opt{flex:1;border:none;background:none;padding:9px;border-radius:8px;font-family:inherit;font-weight:700;color:var(--soft);cursor:pointer;font-size:13px;transition:.13s}
.seg-opt.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.set-fine{text-align:center;color:var(--soft);font-size:12px;margin-top:16px}

/* ===== GOAL CARD EXTRA ===== */
.goal-go{width:100%;margin-top:14px;background:var(--ink);color:var(--paper);border:none;border-radius:11px;
  padding:12px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.goal-go:hover{background:var(--rouge)}

/* ===== REVIEW BANNER ===== */
.review-banner{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;
  background:linear-gradient(110deg,var(--bleu),#5a6be0);color:#fff;border:none;border-radius:16px;
  padding:18px 22px;margin-bottom:18px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.review-banner:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(59,76,192,.3)}
.rev-l{display:flex;align-items:center;gap:14px}
.rev-emoji{font-size:30px}
.rev-l strong{font-family:'Fraunces',serif;font-size:18px;display:block}
.rev-l p{font-size:13px;opacity:.9;margin-top:2px}
.rev-badge{background:#fff;color:var(--bleu);font-weight:800;font-size:14px;padding:9px 15px;border-radius:10px;white-space:nowrap}

.ref-cards-3{grid-template-columns:repeat(3,1fr)}

/* ===== FLASHCARDS ===== */
.vocab-tabs{flex-wrap:wrap;max-width:none}
.flashcard{perspective:1200px;height:280px;margin:6px 0 18px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.fc-back{transform:rotateY(180deg);background:linear-gradient(165deg,#f0fbf6,var(--card))}
.fc-word{font-size:40px;line-height:1.1}
.fc-en{font-size:32px;color:var(--vert)}
.fc-ipa{color:var(--bleu);font-size:15px}
.fc-gender{position:absolute;top:16px;right:16px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 10px;border-radius:99px}
.fc-gender.f{background:#fde7f0;color:#c2367a}
.fc-gender.m{background:#e3eafc;color:#3b4cc0}
.fc-prompt{position:absolute;top:16px;left:0;right:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700}
.fc-say{background:var(--paper);border:1px solid var(--line);color:var(--rouge);font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer;transition:.13s}
.fc-say:hover{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.fc-hint{color:var(--soft);font-size:12px}
.fc-art{font-size:14px;color:var(--soft)}
.fc-art b{color:var(--ink);font-family:'Fraunces',serif}
.fc-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}

/* ===== SRS RATING ===== */
.srs-rate{margin-top:4px}
.srs-q{text-align:center;font-size:14px;color:var(--soft);font-weight:600;margin-bottom:10px}
.srs-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.srs-btn{border:none;border-radius:11px;padding:14px 6px;font-family:inherit;font-weight:800;font-size:14px;color:#fff;cursor:pointer;transition:.13s}
.srs-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.srs-btn.again{background:#d9534f}
.srs-btn.hard{background:#e8a838}
.srs-btn.good{background:var(--vert)}
.srs-btn.easy{background:var(--bleu)}

/* ===== READING ===== */
.read-list{display:flex;flex-direction:column;gap:10px}
.read-card{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}
.read-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--rouge)}
.read-lv{flex-shrink:0;width:42px;height:42px;border-radius:11px;background:var(--bleu);color:#fff;display:grid;place-items:center;font-weight:800;font-family:'Fraunces',serif}
.read-meta{flex:1;min-width:0}
.read-meta strong{display:block;font-size:16px}
.read-meta span{font-size:12px;color:var(--soft)}
.read-go{color:var(--rouge);font-weight:700;font-size:14px;white-space:nowrap}
.read-text{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.rt-fr{font-size:18px;line-height:1.85}
.rt-en{font-size:15px;line-height:1.7;color:var(--soft);margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.rt-speak,.rt-toggle{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-family:inherit;
  font-weight:600;font-size:13px;cursor:pointer;margin-top:14px;margin-right:8px;color:var(--ink)}
.rt-speak:hover{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.rq-q{font-size:18px;font-weight:600;margin:6px 0 14px;font-family:'Fraunces',serif}
.rq-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.rq-opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;
  font-family:inherit;font-size:15px;cursor:pointer;transition:.13s}
.rq-opt:hover{border-color:var(--ink)}
.rq-opt.right{border-color:var(--vert);background:#eafaf3;color:var(--vert);font-weight:700}
.rq-opt.wrong{border-color:var(--rouge);background:#fdeeec;color:var(--rouge)}
.rq-opt.dim{opacity:.5}

/* ===== DIALOGUES ===== */
.dlg-playall{margin-bottom:16px}
.dlg-thread{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.dlg-line{display:flex;flex-direction:column;max-width:85%}
.dlg-line.left{align-self:flex-start;align-items:flex-start}
.dlg-line.right{align-self:flex-end;align-items:flex-end}
.dlg-who{font-size:12px;color:var(--soft);font-weight:700;margin:0 6px 3px}
.dlg-bubble{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 15px;cursor:pointer;transition:.13s}
.dlg-line.right .dlg-bubble{background:var(--bleu);border-color:var(--bleu);color:#fff}
.dlg-bubble:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.dlg-fr{font-size:16px;font-weight:600}
.dlg-en{font-size:13px;opacity:.8;margin-top:3px}
.dlg-line.right .dlg-en{color:#eaecff}
.dlg-spk{font-size:13px;opacity:.7}
.dlg-phrases{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.dlg-phrases h3{font-family:'Fraunces',serif;margin-bottom:12px}
.dlg-phrase{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:11px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;transition:.13s}
.dlg-phrase:hover{border-color:var(--rouge)}
.dlg-phrase b{font-size:15px}
.dlg-phrase span{font-size:13px;color:var(--soft);flex:1}

/* ===== WORD OF DAY ===== */
.wod-card{background:linear-gradient(135deg,var(--bleu),#5a6be0);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:20px;position:relative;overflow:hidden}
.wod-card::before{content:"";position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.wod-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wod-label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.wod-say{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer}
.wod-word{font-family:'Fraunces',serif;font-size:36px;margin:0 0 4px}
.wod-en{font-size:18px;opacity:.9;margin:0 0 4px}
.wod-ipa{font-size:13px;opacity:.7;margin:0 0 10px}
.wod-more{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
.wod-more:hover{background:rgba(255,255,255,.3)}
.wod-card .fc-gender{position:static;margin-top:6px;display:inline-block}

/* ===== ACTION ROW (review + mistakes side by side) ===== */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.review-banner.half{margin-bottom:0;flex-direction:column;align-items:flex-start;gap:8px;padding:16px}
.review-banner.half .rev-badge{align-self:flex-end}
.review-banner.mistakes{background:linear-gradient(110deg,var(--rouge),#e8703d)}
.review-banner.dim{opacity:.7}

/* ===== CONJUGATION ===== */
.conj-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.conj-tab{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;
  font-family:inherit;font-weight:700;font-size:13px;color:var(--soft);cursor:pointer;transition:.13s;white-space:nowrap}
.conj-tab:hover{border-color:var(--bleu);color:var(--bleu)}
.conj-tab.on{background:var(--bleu);border-color:var(--bleu);color:#fff}
.conj-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px}
.conj-verb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.conj-inf{font-family:'Fraunces',serif;font-size:28px;color:var(--bleu)}
.conj-meaning{font-size:14px;color:var(--soft)}
.conj-tense{background:var(--bleu);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.conj-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.conj-row{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.conj-row:last-child{border:none}
.conj-row.right .conj-input{border-color:var(--vert);background:#eafaf3}
.conj-row.wrong .conj-input{border-color:var(--rouge);background:#fdeeec}
.conj-subj{font-weight:700;font-size:14px;color:var(--soft)}
.conj-input{border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:15px;background:var(--paper);color:var(--ink);outline:none;width:100%;transition:.13s}
.conj-input:focus{border-color:var(--bleu)}
.conj-ans{font-size:13px;font-weight:700;color:var(--vert);white-space:nowrap}
.conj-score{text-align:center;font-size:13px;color:var(--soft);margin-top:10px}
.conj-list{display:flex;flex-direction:column;gap:6px}
.conj-list h3{font-family:'Fraunces',serif;margin-bottom:8px}
.conj-verb-btn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:inherit;cursor:pointer;transition:.13s}
.conj-verb-btn:hover{border-color:var(--bleu)}
.conj-verb-btn.on{border-color:var(--bleu);background:#edf0fd}
.conj-verb-btn b{font-size:15px;color:var(--bleu)}
.conj-verb-btn span{font-size:12px;color:var(--soft)}

/* ===== PHRASEBOOK ===== */
.pb-tabs{flex-wrap:wrap}
.locked-tab{opacity:.7}
.pb-lock{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:24px;text-align:center;margin-top:16px}
.pb-lock p{margin:6px 0;font-size:15px}
.pb-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pb-phrase{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;font-family:inherit;transition:.13s}
.pb-phrase:hover{border-color:var(--rouge);transform:translateY(-1px)}
.pb-fr{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:3px}
.pb-en{font-size:13px;color:var(--soft)}

/* ===== CULTURAL NOTES ===== */
.cn-list{display:flex;flex-direction:column;gap:8px}
.cn-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s}
.cn-card:hover{border-color:var(--or)}
.cn-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:16px 18px;cursor:pointer;font-family:inherit}
.cn-emoji{font-size:24px;flex-shrink:0}
.cn-title{font-size:16px;font-weight:700;flex:1}
.cn-chev{font-size:18px;color:var(--soft);font-weight:700}
.cn-body{padding:0 18px 16px;font-size:15px;line-height:1.7;color:var(--soft);border-top:1px solid var(--line)}

/* ===== MISTAKE TRACKER ===== */
.mistake-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mistake-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.mistake-row>div{flex:1;min-width:0}
.ms-en{font-size:13px;color:var(--soft);margin-left:8px}
.ms-count{font-size:13px;color:var(--rouge);font-weight:700;white-space:nowrap}
.fc-say.sm{padding:6px 10px;font-size:13px}

@media(max-width:520px){
  .action-row{grid-template-columns:1fr}
  .conj-row{grid-template-columns:80px 1fr auto}
}

/* ===== VOICE PICKER (clear, two-action rows) ===== */
.voice-list{display:flex;flex-direction:column;gap:8px}
.voice-row{display:flex;align-items:center;gap:12px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px}
.voice-row.on{border-color:var(--vert);background:#f0fbf6}
.voice-check{width:20px;flex-shrink:0;text-align:center;color:var(--vert);font-weight:800;font-size:16px}
.voice-meta{flex:1;min-width:0}
.voice-name{display:block;font-weight:700;font-size:15px}
.voice-sub{display:block;font-size:12px;color:var(--soft)}
.voice-hear{background:var(--card);border:1px solid var(--line);color:var(--bleu);font-weight:700;
  font-size:13px;padding:8px 12px;border-radius:9px;white-space:nowrap;flex-shrink:0;transition:.13s}
.voice-hear:hover{border-color:var(--bleu);background:var(--bleu);color:#fff}
.voice-use{background:var(--ink);border:none;color:var(--paper);font-weight:700;font-size:13px;
  padding:8px 16px;border-radius:9px;white-space:nowrap;flex-shrink:0;transition:.13s}
.voice-use:hover{background:var(--vert)}
.voice-using{color:var(--vert);font-weight:700;font-size:13px;white-space:nowrap;flex-shrink:0;padding:8px 4px}
.voice-empty{font-size:13px;color:var(--soft);background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px;line-height:1.6}

/* ===== CLOZE EXERCISE ===== */
.cloze-wrap{margin-bottom:18px}
.cloze-hint{font-size:13px;color:var(--soft);font-weight:600;margin-bottom:12px}
.cloze-sentence{font-family:'Fraunces',serif;font-size:24px;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cloze-blank{font-family:'Spline Sans';font-size:18px;border:none;border-bottom:2px solid var(--bleu);background:var(--paper);
  padding:4px 10px;min-width:90px;width:120px;text-align:center;outline:none;border-radius:6px 6px 0 0}
.cloze-blank:focus{background:#eef2f8}
.cloze-blank.right{border-color:var(--vert);background:#e7efe8}
.cloze-blank.wrong{border-color:var(--rouge);background:#f8e9e6}
.cloze-en{font-size:14px;color:var(--soft);font-style:italic;margin-top:12px}

@media(max-width:600px){
  .prof-grid{grid-template-columns:repeat(2,1fr)}
  .land-title{font-size:40px}
  .meta{gap:10px}.rank{display:none}

  .pr-row{grid-template-columns:54px 1fr;row-gap:4px}

  .cloze-sentence{font-size:20px}
}

// ---- local session cache (avoids a round-trip on every render) ----
// We still keep a copy in localStorage as an offline fallback, but the
// cloud is the source of truth. On login we sync down; on change we sync up.

const cacheSet = (obj) => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(obj)); } catch {} };
const cacheClear = () => { try { localStorage.removeItem(CACHE_KEY); } catch {} };

};
const ALL_AVATARS = [...AVATAR_SETS.female, ...AVATAR_SETS.male, ...AVATAR_SETS.other];
const defaultAvatar = (name) => ALL_AVATARS[(name || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0) % ALL_AVATARS.length];
const avatarOf = (user) => (user && user.avatar) || defaultAvatar(user && user.name);

// ============================================================
//  CLOUD AUTH — all async, returns { user, error } shapes
// ============================================================

// Sign up: creates a real Supabase auth account + profile row.
async function registerUser({ firstName, lastName, email, phone, avatar, password }) {
  const name = (firstName.trim() + " " + lastName.trim()).trim();
  // Step 1: create the auth account. The database trigger automatically
  // creates the profiles row — we must NOT insert it manually (race condition).
  const { data, error } = await sb.auth.signUp({
    email: email.trim().toLowerCase(),
    password,
    options: {
      data: { first_name: firstName.trim(), last_name: lastName.trim() }
    }
  });
  if (error) return { error: error.message };
  const id = data.user.id;

  // Step 2: wait briefly for the trigger to fire, then UPDATE the row
  // the trigger created with avatar + phone + full progress.
  await new Promise(r => setTimeout(r, 800));
  const prog = blankProgress();
  const chosenAvatar = avatar || defaultAvatar(name);
  const { error: upErr } = await sb.from("profiles").update({
    first_name: firstName.trim(),
    last_name: lastName.trim(),
    phone: (phone || "").trim(),
    avatar: chosenAvatar,
    progress: prog,
  }).eq("id", id);

  // If update fails it's ok — the trigger row still exists with blank data
  // and loadProfile will fill it in correctly.
  const userObj = {
    id, name, firstName: firstName.trim(), lastName: lastName.trim(),
    email: email.trim(), phone: (phone || "").trim(),
    avatar: chosenAvatar,
  };
  cacheSet({ user: userObj, progress: prog });
  return { user: userObj, progress: prog };
}

// Log in: verify email + password, load profile from cloud.
async function loginUser(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({
    email: email.trim().toLowerCase(),
    password,
  });
  if (error) return { error: "Wrong email or password. Please try again." };
  return await loadProfile(data.user);
}

// Load profile for an already-authenticated user.
async function loadProfile(authUser) {
  const u = authUser || (await sb.auth.getUser()).data.user;
  if (!u) return { error: "Not logged in." };
  const { data, error } = await sb.from("profiles").select("*").eq("id", u.id).single();
  if (error) return { error: error.message };
  const userObj = {
    id: u.id, name: (data.first_name + " " + data.last_name).trim(),
    firstName: data.first_name, lastName: data.last_name,
    email: u.email, phone: data.phone || "", avatar: data.avatar,
  };
  const prog = { ...blankProgress(), ...(data.progress || {}) };
  cacheSet({ user: userObj, progress: prog });
  return { user: userObj, progress: prog };
}

// Save progress to cloud (fire-and-forget; also updates local cache).
async function saveProgress(userId, progress) {
  const cached = cacheGet();
  cacheSet({ ...cached, progress });
  await sb.from("profiles").update({ progress, updated_at: new Date().toISOString() }).eq("id", userId);
}

// Update avatar both in cloud and local cache.
async function setUserAvatar(userId, avatar) {
  const cached = cacheGet();
  if (cached.user) { cached.user.avatar = avatar; cacheSet(cached); }
  await sb.from("profiles").update({ avatar }).eq("id", userId);
}

// Sign out: clear cloud session + local cache.
async function signOut() {
  cacheClear();
  await sb.auth.signOut();
}

// Check if a Supabase session is still alive (for auto-resume on page load).
async function getSession() {
  const { data } = await sb.auth.getSession();
  return data.session;
}

// List recent accounts from local cache for quick-switch UI.
// In a cloud app this is just "the last logged-in user" (no multi-account list).
function listLocalAccounts() {
  const cached = cacheGet();
  if (!cached.user) return [];
  return [{ ...cached.user, avatar: avatarOf(cached.user) }];
}
