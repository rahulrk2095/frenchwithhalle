        <ul className="pw-list">
          <li>{CURRICULUM.filter(l => isPremiumLevel(l.level)).reduce((s, l) => s + l.units.length, 0)} units across A2 → C1, beyond the free previews</li>
          <li>{CURRICULUM.filter(l => isPremiumLevel(l.level)).reduce((s, l) => s + l.units.reduce((a, u) => a + u.ex.length, 0), 0)}+ exercises: grammar, conjugation, listening, word-building & fill-the-blank</li>
          <li>Keep your stars, XP and streak across everything</li>
          <li>One payment — no subscription, ever</li>
        </ul>
        {state === "done" ? (
          <div className="pw-done">✓ Unlocked! Bienvenue.</div>
        ) : (
          <button className="cta wide buybtn" disabled={state === "processing"} onClick={onBuy}>
            {state === "processing" ? "Processing…" : `Unlock for ${PRICE_LABEL}`}
          </button>
        )}
        <p className="pw-fine">Demo checkout — no real charge. In the live app this opens secure Stripe payment.</p>
      </div>
    </div>
  );
}

// ============================================================
//  MAIN APP
// ============================================================
function App() {
  const [userKey, setUserKey] = useState(() => safeGet().current);
  const [user, setUser] = useState(null);
  const [progress, setProgress] = useState(blankProgress());
  const [route, setRoute] = useState({ name: "home" });
  const [openLevel, setOpenLevel] = useState("A1");
  const [showProfile, setShowProfile] = useState(false);
  const [showPaywall, setShowPaywall] = useState(false);
  const [toast, setToast] = useState(null);

  // load profile whenever userKey changes
  useEffect(() => {
    if (!userKey) { setUser(null); return; }
    const data = safeGet();
    const u = data.users[userKey];
    if (!u) { setUserKey(null); return; }
    setUser(u);
    // streak bookkeeping on login
    const today = dayIdx();
    const p = { ...blankProgress(), ...u.progress };
    if (p.lastDay == null) { p.streak = 1; }
    else if (p.lastDay === today) { /* same day, keep */ }
    else if (p.lastDay === today - 1) { p.streak = (p.streak || 0) + 1; }
    else { p.streak = 1; }
    p.lastDay = today;
    // reset the daily counter when a new day begins
    if (p.todayDay !== today) { p.todayDay = today; p.todayCount = 0; }
    // mirror settings into the module-level LIVE holder for norm()/speak()
    const st = p.settings || {};
    LIVE.audioSpeed = st.audioSpeed || "normal";
    LIVE.strictAccents = !!st.strictAccents;
    LIVE.autoAdvance = !!st.autoAdvance;
    LIVE.voiceURI = st.voiceURI || null;
    LIVE.pitch = st.pitch || 1;
    setProgress(p);
    // write the streak/lastDay update back so it persists
    const d2 = safeGet();
    if (d2.users[userKey]) { d2.users[userKey].progress = p; safeSet(d2); }
  }, [userKey]);

  // persist via functional update so concurrent calls compose (no clobbering).
  // `updater` receives the freshest progress and returns the next progress.
  const persist = useCallback((updater) => {
    setProgress((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      const data = safeGet();
      if (userKey && data.users[userKey]) { data.users[userKey].progress = next; safeSet(data); }
      return next;
    });
  }, [userKey]);

  const unlockStatus = useMemo(() => computeUnlocks(progress.scores, progress.hasPaid), [progress.scores, progress.hasPaid]);

  const awardXP = useCallback((n) => {
    persist((p) => ({ ...p, xp: p.xp + n }));
  }, [persist]);

  const completeUnit = useCallback((unitId, score) => {
    persist((p) => {
      const newScore = Math.max(p.scores[unitId] || 0, score);
      const wasUnlocked = computeUnlocks(p.scores, p.hasPaid);
      const nextScores = { ...p.scores, [unitId]: newScore };
      const nowUnlocked = computeUnlocks(nextScores, p.hasPaid);
      let newlyOpened = null;
      CURRICULUM.forEach((lv) => {
        if (wasUnlocked[lv.level].locked && !nowUnlocked[lv.level].locked) newlyOpened = lv;
      });
      if (newlyOpened) {
        // defer setState out of the updater
        setTimeout(() => {
          setToast({ type: "unlock", level: newlyOpened.level, name: newlyOpened.name });
          setTimeout(() => setToast(null), 4200);
        }, 0);
      }
      return { ...p, scores: nextScores };
    });
  }, [persist]);

  const recordChallenge = useCallback((score) => {
    persist((p) => score > (p.bestChallenge || 0) ? { ...p, bestChallenge: score } : p);
  }, [persist]);

  const claimDaily = useCallback(() => {
    persist((p) => ({ ...p, dailyClaimedDay: dayIdx() }));
  }, [persist]);

  // count every answered question toward today's goal + history (for the calendar)
  const recordAnswer = useCallback(() => {
    persist((p) => {
      const today = dayIdx();
      const sameDay = p.todayDay === today;
      const todayCount = (sameDay ? (p.todayCount || 0) : 0) + 1;
      const history = { ...(p.history || {}), [today]: todayCount };
      return { ...p, todayDay: today, todayCount, history };
    });
  }, [persist]);

  const changeGoal = useCallback((g) => {
    persist((p) => ({ ...p, dailyGoal: g }));
  }, [persist]);

  // schedule a flashcard after the learner rates their recall
  const reviewCard = useCallback((wordId, rating) => {
    persist((p) => {
      const today = dayIdx();
      const srs = { ...(p.srs || {}) };
      srs[wordId] = scheduleCard(srs[wordId], rating, today);
      return { ...p, srs };
    });
    awardXP(rating === 0 ? 2 : 5); // small XP for reviewing; less if "again"
  }, [persist, awardXP]);

  const changeSettings = useCallback((next) => {
    // update the live mirror immediately so it affects the current session
    LIVE.audioSpeed = next.audioSpeed || "normal";
    LIVE.strictAccents = !!next.strictAccents;
    LIVE.autoAdvance = !!next.autoAdvance;
    LIVE.voiceURI = next.voiceURI || null;
    LIVE.pitch = next.pitch || 1;
    persist((p) => ({ ...p, settings: next }));
  }, [persist]);

  // ---- purchase the $5 unlock ----
  const [buyState, setBuyState] = useState("idle"); // idle | processing | done
  const startPurchase = useCallback(async () => {
    setBuyState("processing");
    const res = await purchaseUnlock();   // ← becomes the real Stripe call later
    if (res && res.ok) {
      persist((p) => ({ ...p, hasPaid: true }));
      setBuyState("done");
      setTimeout(() => { setBuyState("idle"); setShowPaywall(false); }, 1400);
    } else {
      setBuyState("idle");
    }
  }, [persist]);

  // ---- not signed in ----
  if (!userKey || !user) {
    return (<><style>{CSS}</style><Landing onAuthed={(k) => setUserKey(k)} /></>);
  }

  // ---- derived display values ----
  const level = Math.floor(progress.xp / 150) + 1;
  const levelProg = Math.round(((progress.xp % 150) / 150) * 100);
  const rankName = ["Débutant", "Apprenti", "Voyageur", "Causeur", "Éloquent", "Maître"][Math.min(level - 1, 5)];
  const totalUnits = allUnits.length;
  const doneUnits = Object.keys(progress.scores).length;
  const dailyClaimed = progress.dailyClaimedDay === dayIdx();
  const goUnit = (u) => setRoute({ name: "unit", unit: u });

  return (
    <div className="root">
      <style>{CSS}</style>
      <div className="grain" />

      {toast && toast.type === "unlock" && (
        <div className="toast">
          <div className="toast-in">
            <span className="toast-key">🔓</span>
            <div><strong>Level {toast.level} unlocked!</strong><p>{toast.name} is now open. Allez-y !</p></div>
          </div>
        </div>
      )}

      <header className="top">
        <div className="logo" onClick={() => setRoute({ name: "home" })}>
          <span className="mark">H</span>
          <div><strong>French with Halle</strong><em>Français · A1 → C1</em></div>
        </div>
        <div className="meta">
          <div className="streakchip" title="Daily streak">🔥 {progress.streak}</div>
          <div className="rank"><span>{rankName}</span><small>Niveau {level}</small></div>
          <button className="gear-btn" onClick={() => setRoute({ name: "settings" })} title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <button className="avatar-btn" onClick={() => setShowProfile(true)} title="Profile">
            <span className="avatar">{avatarOf(user)}</span>
          </button>
        </div>
      </header>

      {showProfile && (
        <Profile user={user} progress={progress} unlockStatus={unlockStatus}
          onClose={() => setShowProfile(false)}
          onChangeAvatar={(a) => { setUserAvatar(userKey, a); setUser({ ...user, avatar: a }); }}
          onSignOut={() => { signOut(); setShowProfile(false); setUserKey(null); setRoute({ name: "home" }); }} />
      )}

      {showPaywall && (
        <Paywall state={buyState} onBuy={startPurchase} onClose={() => setShowPaywall(false)} />
      )}

      {route.name === "home" && (
        <main className="home">
          <section className="hero">
            <p className="eyebrow">Bon retour, {user.name.split(" ")[0]} 👋</p>
            <h1>Your <span>journey</span> continues.</h1>
            <p className="lede">Complete units to earn stars and unlock the next level. Keep your streak alive and climb from Débutant to Maître.</p>
            <div className="hero-row">
              <button className="cta" onClick={() => setRoute({ name: "challenge" })}>⚔ Challenge mode</button>
              <button className={`cta outline ${dailyClaimed ? "" : "pulse"}`} onClick={() => setRoute({ name: "daily" })}>
                {dailyClaimed ? "Today's expression ✓" : "✨ Daily +20 XP"}
              </button>
            </div>
            <div className="hero-prog">
              <div className="hp-row"><span>Level {level} · {rankName}</span><span>{progress.xp % 150}/150 XP</span></div>
              <div className="hp-bar"><div style={{ width: `${levelProg}%` }} /></div>
              <span className="hp-units">{doneUnits} / {totalUnits} units mastered</span>
            </div>
          </section>

          <DailyGoalCard progress={progress} onChangeGoal={changeGoal} onPractise={() => setRoute({ name: "review" })} />

          {(() => {
            const due = countDue(progress.srs || {}, dayIdx());
            return (
              <button className="review-banner" onClick={() => setRoute({ name: "review" })}>
                <div className="rev-l">
                  <span className="rev-emoji">🔁</span>
                  <div>
                    <strong>Daily review</strong>
                    <p>Spaced repetition — practise words right before you'd forget them</p>
                  </div>
                </div>
                <span className="rev-badge">{due > 0 ? `${due} due →` : "Start →"}</span>
              </button>
            );
          })()}

          {!progress.hasPaid && (
            <button className="upsell" onClick={() => setShowPaywall(true)}>
              <div className="upsell-l">
                <span className="upsell-badge">✦</span>
                <div>
                  <strong>Unlock the full course</strong>
                  <p>All levels A2 → C1 · one payment of {PRICE_LABEL}, forever</p>
                </div>
              </div>
              <span className="upsell-cta">Unlock {PRICE_LABEL} →</span>
            </button>
          )}

          <div className="ref-cards ref-cards-3">
            <button className="ref-card" onClick={() => setRoute({ name: "vocab" })}>
              <span className="ref-emoji">🗂️</span>
              <div><strong>Flashcard library</strong><p>{VOCAB_FLAT.length} voiced words — free</p></div>
            </button>
            <button className="ref-card" onClick={() => setRoute({ name: "grammar" })}>
              <span className="ref-emoji">📖</span>
              <div><strong>Grammar library</strong><p>Every rule, by level — free</p></div>
            </button>
            <button className="ref-card" onClick={() => setRoute({ name: "pronunciation" })}>
              <span className="ref-emoji">🔊</span>
              <div><strong>Pronunciation guide</strong><p>Sounds & IPA, spoken — free</p></div>
            </button>
          </div>

          <h3 className="sec-title">Levels</h3>
          <div className="levels">
            {CURRICULUM.map((lv, idx) => {
              const st = unlockStatus[lv.level];
              const lvDone = lv.units.filter((u) => progress.scores[u.id] != null).length;
              const lvStars = lv.units.reduce((s, u) => s + starsFor(progress.scores[u.id]), 0);
              const payLocked = st.reason === "pay";
              // Premium levels are still expandable so the free taster shows.
              const isOpen = openLevel === lv.level && (!st.locked || payLocked);
              return (
                <section key={lv.level} className={`lvl ${isOpen ? "open" : ""} ${st.locked ? "locked" : ""} ${payLocked ? "paylock" : ""}`}>
                  <button className="lvl-head" onClick={() => {
                    if (st.locked && !payLocked) return;           // progression-locked: not clickable
                    setOpenLevel(isOpen ? "" : lv.level);          // free + paylocked: expandable
                  }}>
                    <span className="badge">{payLocked ? "✦" : st.locked ? "🔒" : lv.level}</span>
                    <div className="lvl-meta">
                      <h2>{lv.name} <small className="lvl-code">{lv.level}</small></h2>
                      {payLocked
                        ? <p className="pay-msg">First unit free to preview · unlock everything for {PRICE_LABEL}</p>
                        : st.locked
                          ? <p className="lock-msg">Complete {st.need - st.have} more unit{st.need - st.have > 1 ? "s" : ""} in {st.prevName} to unlock</p>
                          : <p>{lv.sub} — {lv.desc}</p>}
                    </div>
                    <div className="lvl-side">
                      {payLocked && <span className="pay-pill">Free preview</span>}
                      {!st.locked && <span className="lvl-stars">⭐ {lvStars}/{lv.units.length * 3}</span>}
                      <span className="lvl-frac">{lvDone}/{lv.units.length}</span>
                      {(!st.locked || payLocked) && <span className="chev">{isOpen ? "−" : "+"}</span>}
                    </div>
                  </button>
                  {isOpen && (
                    <div className="units">
                      {lv.units.map((u, n) => {
                        const sc = progress.scores[u.id];
                        const st3 = starsFor(sc);
                        const access = canAccessUnit(lv.level, n, progress.hasPaid);
                        const taster = isTasterUnit(lv.level, n) && !progress.hasPaid;
                        return (
                          <button key={u.id} className={`unit-card ${!access ? "uclocked" : ""} ${taster ? "uctaster" : ""}`} style={{ animationDelay: `${n * 60}ms` }}
                            onClick={() => access ? goUnit({ ...u, level: lv.level }) : setShowPaywall(true)}>
                            <div className="uc-head">
                              <h3>{u.title}</h3>
                              {taster ? <span className="uc-taster">FREE</span>
                                : !access ? <span className="uc-lock">🔒</span>
                                : sc != null ? <span className={`uc-score ${sc === 100 ? "perfect" : ""}`}>{sc}%</span> : null}
                            </div>
                            <p className="uc-focus">{u.focus}</p>
                            {access ? (
                              <div className="uc-stars">
                                {[1, 2, 3].map((i) => <span key={i} className={i <= st3 ? "on" : ""}>★</span>)}
                              </div>
                            ) : <div className="uc-stars dim">{[1,2,3].map(i=><span key={i}>★</span>)}</div>}
                            <div className="uc-foot">
                              <span>{u.vocab.length} words · {u.ex.length} drills</span>
                              <span className="uc-go">{!access ? `Unlock ${PRICE_LABEL} →` : taster ? "Try free →" : sc != null ? "Replay →" : "Start →"}</span>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </section>
              );
            })}
          </div>
        </main>
      )}

      {route.name === "unit" && (
        <main className="page">
          <Unit unit={route.unit} onBack={() => setRoute({ name: "home" })} onComplete={completeUnit}
            awardXP={awardXP} onAnswered={recordAnswer} autoAdvance={!!(progress.settings && progress.settings.autoAdvance)} />
        </main>
      )}
      {route.name === "challenge" && (
        <main className="page"><Challenge onExit={() => setRoute({ name: "home" })} awardXP={awardXP} onFinish={recordChallenge} onAnswered={recordAnswer} /></main>
      )}
      {route.name === "daily" && (
        <main className="page"><Daily onExit={() => setRoute({ name: "home" })} awardXP={awardXP} claimed={dailyClaimed} claim={claimDaily} /></main>
      )}
      {route.name === "grammar" && (
        <main className="page"><GrammarLibrary onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "pronunciation" && (
        <main className="page"><PronunciationGuide onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "settings" && (
        <main className="page"><Settings progress={progress} onChange={changeSettings} onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "vocab" && (
        <main className="page"><VocabLibrary progress={progress} onExit={() => setRoute({ name: "home" })} /></main>
      )}
      {route.name === "review" && (
        <main className="page"><ReviewSession progress={progress} onReview={reviewCard} onAnswered={recordAnswer}
          onExit={() => setRoute({ name: "home" })} /></main>
      )}

      <footer className="bottom">French with Halle · signed in as {user.name} · <em>bon courage</em></footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
