// ---------- HELPERS ----------
const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9' ]/g, "").replace(/\s+/g, " ").trim();
const dayIdx = () => Math.floor((Date.now() - new Date(2024, 0, 1)) / 864e5);
const shuffle = (a) => [...a].sort(() => Math.random() - 0.5);

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = 0.88;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

const allUnits = CURRICULUM.flatMap((lv) => lv.units.map((u) => ({ ...u, level: lv.level })));

// ---------- SMALL UI ----------
function Speaker({ text, big }) {
  return (
    <button className={`spk ${big ? "big" : ""}`} onClick={(e) => { e.stopPropagation(); speak(text); }} title="Écouter" aria-label="Listen">
      <svg viewBox="0 0 24 24" width={big ? 20 : 15} height={big ? 20 : 15} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M19 5a10 10 0 0 1 0 14" />
      </svg>
    </button>
  );
}

// ---------- EXERCISE ENGINE ----------
function Exercise({ item, onResult }) {
  const [val, setVal] = useState("");
  const [picked, setPicked] = useState(null);
  const [order, setOrder] = useState([]);
  const [pool, setPool] = useState(() => (item.k === "build" ? shuffle(item.tiles) : []));
  const [status, setStatus] = useState("idle"); // idle | right | wrong
  const inp = useRef(null);

  useEffect(() => {
    setVal(""); setPicked(null); setOrder([]); setStatus("idle");
    setPool(item.k === "build" ? shuffle(item.tiles) : []);
    if (item.k === "listen") setTimeout(() => speak(item.a), 350);
    setTimeout(() => inp.current && inp.current.focus(), 60);
  }, [item]);

  const settle = (ok) => { setStatus(ok ? "right" : "wrong"); if (ok) speak(item.a); onResult(ok); };

  const submit = () => {
    if (status !== "idle") return;
    if (item.k === "choice") { if (picked == null) return; settle(picked === item.a); }
    else if (item.k === "build") { settle(order.join(" ") === item.a); }
    else { settle(norm(val) === norm(item.a)); }
  };

  const tag = { flashcard: "Learn", translate: "Translate", choice: "Choose", build: "Word order", listen: "Listening", conjugate: "Conjugate" }[item.k];

  return (
    <div className="ex">
      <div className="ex-tagrow">
        <span className="ex-tag">{tag}</span>
        {item.verb && <span className="ex-verb">{item.verb}</span>}
      </div>

      {item.k === "listen" ? (
        <div className="listen-q">
          <button className="replay" onClick={() => speak(item.a)}>
            <Speaker text={item.a} big /> Replay audio
          </button>
        </div>
      ) : (
        <h3 className="ex-q">{item.q}{item.subj && <em> · subject: {item.subj}</em>}</h3>
      )}

      {item.k === "choice" && (
        <div className="opts">
          {item.opts.map((o) => (
            <button key={o}
              className={`opt ${picked === o ? "sel" : ""} ${status !== "idle" && o === item.a ? "correct" : ""} ${status === "wrong" && picked === o ? "bad" : ""}`}
              disabled={status !== "idle"}
              onClick={() => setPicked(o)}>{o}</button>
          ))}
        </div>
      )}

      {item.k === "build" && (
        <>
          <div className="build-line">
            {order.length === 0 && <span className="build-ph">Tap the words in order…</span>}
            {order.map((w, i) => (
              <button key={i} className="tile placed" disabled={status !== "idle"}
                onClick={() => { setOrder(order.filter((_, j) => j !== i)); setPool([...pool, w]); }}>{w}</button>
            ))}
          </div>
          <div className="build-pool">
            {pool.map((w, i) => (
              <button key={i} className="tile" disabled={status !== "idle"}
                onClick={() => { setOrder([...order, w]); setPool(pool.filter((_, j) => j !== i)); }}>{w}</button>
            ))}
          </div>
        </>
      )}

      {(item.k === "translate" || item.k === "conjugate" || item.k === "listen") && (
        <input ref={inp} className={`field ${status}`} value={val}
          placeholder={item.k === "conjugate" ? "verb form…" : "ta réponse…"}
          disabled={status !== "idle"}
          onChange={(e) => setVal(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
      )}

      {status === "idle" ? (
        <button className="cta" onClick={submit}>Check answer</button>
      ) : (
        <div className={`verdict ${status}`}>
          <span>
            {status === "right" ? "Correct — " : "Answer: "}
            <strong>{item.a}</strong> <Speaker text={item.a} />
          </span>
        </div>
      )}
    </div>
  );
}

function Unit({ unit, onBack, onComplete, awardXP }) {
  const [stage, setStage] = useState("study"); // study | drill | done
  const [vi, setVi] = useState(0);
  const [reveal, setReveal] = useState(false);
  const seq = useMemo(() => shuffle(unit.ex), [unit.id]);
  const [ei, setEi] = useState(0);
  const [correct, setCorrect] = useState(0);
  const [streak, setStreak] = useState(0);

  useEffect(() => { setStage("study"); setVi(0); setReveal(false); setEi(0); setCorrect(0); setStreak(0); }, [unit.id]);

  const card = unit.vocab[vi];
  const exItem = seq[ei];

  const handleResult = (ok) => {
    if (ok) { setCorrect((c) => c + 1); setStreak((s) => s + 1); awardXP(10 + Math.min(streak, 5) * 2); }
    else setStreak(0);
  };

  const advanceEx = () => {
    if (ei + 1 < seq.length) setEi(ei + 1);
    else { const score = Math.round((correct / seq.length) * 100); onComplete(unit.id, score); awardXP(40); setStage("done"); }
  };

  return (
    <div className="unit">
      <button className="back" onClick={onBack}>← Le parcours</button>
      <div className="unit-banner">
        <span className="lvtag">{unit.level}</span>
        <h2>{unit.title}</h2>
        <p>{unit.focus}</p>
      </div>

      <div className="steps">
        <span className={stage === "study" ? "on" : ""}>1 · Study</span>
        <span className={stage === "drill" ? "on" : ""}>2 · Drill</span>
        <span className={stage === "done" ? "on" : ""}>3 · Result</span>
      </div>

      {stage === "study" && (
        <>
          <div className="grammar">
            <span className="g-label">Grammar</span>
            <h4>{unit.grammar.t}</h4>
            <p>{unit.grammar.b}</p>
          </div>
          <div className={`vcard ${reveal ? "rev" : ""}`} onClick={() => setReveal((r) => !r)}>
            <Speaker text={card.fr} big />
            <h3>{card.fr}</h3>
            <p className="ipa">/{card.ipa}/</p>
            <p className="vmean">{reveal ? card.en : "Tap to reveal meaning"}</p>
          </div>
          <div className="vnav">
            <button className="ghost" disabled={vi === 0} onClick={() => { setVi(vi - 1); setReveal(false); }}>← Prev</button>
            <span className="counter">{vi + 1} / {unit.vocab.length}</span>
            {vi + 1 < unit.vocab.length
              ? <button className="ghost" onClick={() => { setVi(vi + 1); setReveal(false); }}>Next →</button>
              : <button className="cta sm" onClick={() => setStage("drill")}>Start drill →</button>}
          </div>
        </>
      )}

      {stage === "drill" && (
        <>
          <div className="drill-top">
            <div className="bar"><div className="bar-f" style={{ width: `${(ei / seq.length) * 100}%` }} /></div>
            <span className="counter">Q{ei + 1}/{seq.length} · 🔥{streak}</span>
          </div>
          <Exercise key={ei} item={exItem} onResult={handleResult} />
          <button className="cta ghostnext" onClick={advanceEx}>
            {ei + 1 < seq.length ? "Next question →" : "See result →"}
          </button>
        </>
      )}

      {stage === "done" && (
        <div className="result">
          <div className="score-ring" style={{ "--p": Math.round((correct / seq.length) * 100) }}>
            <span>{Math.round((correct / seq.length) * 100)}%</span>
          </div>
          <h2>{correct === seq.length ? "Sans faute ! 🏅" : correct >= seq.length * 0.6 ? "Bien joué !" : "Keep going!"}</h2>
          <p>You got {correct} of {seq.length} correct and earned XP for this unit.</p>
          <div className="result-btns">
            <button className="ghost" onClick={() => { setStage("study"); setVi(0); setEi(0); setCorrect(0); }}>Review again</button>
            <button className="cta sm" onClick={onBack}>Back to path</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- CHALLENGE MODE ----------
function Challenge({ onExit, awardXP }) {
  const pool = useMemo(() => shuffle(allUnits.flatMap((u) => u.ex.filter((e) => e.k !== "flashcard"))).slice(0, 12), []);
  const [i, setI] = useState(0);
  const [lives, setLives] = useState(3);
  const [score, setScore] = useState(0);
  const [over, setOver] = useState(false);

  const onResult = (ok) => {
    if (ok) { setScore((s) => s + 1); awardXP(15); }
    else { setLives((l) => l - 1); }
  };
  const next = () => {
    if (lives <= 0) return;
    if (i + 1 < pool.length) setI(i + 1); else setOver(true);
  };
  useEffect(() => { if (lives <= 0) setOver(true); }, [lives]);

  if (over) {
    return (
      <div className="unit">
        <div className="result">
          <h2>{lives <= 0 ? "Game over" : "Défi terminé !"}</h2>
          <p className="big-score">{score}<span> pts</span></p>
          <p>{score >= 9 ? "Exceptional — that's near-fluent reflexes." : score >= 5 ? "Solid run. Push for the high score." : "Every champion starts somewhere."}</p>
          <button className="cta sm" onClick={onExit}>Return home</button>
        </div>
      </div>
    );
  }

  return (
    <div className="unit">
      <button className="back" onClick={onExit}>← Quit challenge</button>
      <div className="ch-hud">
        <span className="hearts">{"♥".repeat(lives)}<span className="dim">{"♡".repeat(3 - lives)}</span></span>
        <span className="ch-score">Score {score}</span>
        <span className="counter">{i + 1}/{pool.length}</span>
      </div>
      <div className="ch-tag">CHALLENGE · mixed levels · no hints</div>
      <Exercise key={i} item={pool[i]} onResult={onResult} />
      <button className="cta ghostnext" onClick={next}>Continue →</button>
    </div>
  );
}

// ---------- DAILY ----------
function Daily({ onExit, awardXP, claimed, claim }) {
  const d = DAILY[dayIdx() % DAILY.length];
  return (
    <div className="unit">
      <button className="back" onClick={onExit}>← Accueil</button>
      <div className="daily-wrap">
        <span className="daily-kicker">Expression du jour</span>
        <h2 className="daily-fr">« {d.fr} »</h2>
        <div className="daily-actions">
          <Speaker text={d.fr} big />
          <span className="daily-en">{d.en}</span>
        </div>
        {!claimed
          ? <button className="cta" onClick={() => { claim(); awardXP(20); speak(d.fr); }}>Listen & claim +20 XP</button>
          : <button className="cta done" disabled>✓ Claimed — revient demain</button>}
      </div>
    </div>
  );
}

// ---------- APP ----------
function App() {
  const [route, setRoute] = useState({ name: "home" });
  const [xp, setXp] = useState(0);
  const [scores, setScores] = useState({}); // unitId -> best %
  const [dailyClaimed, setDailyClaimed] = useState(false);
  const [openLevel, setOpenLevel] = useState("A1");

  const awardXP = useCallback((n) => setXp((x) => x + n), []);
  const completeUnit = (id, score) => setScores((s) => ({ ...s, [id]: Math.max(s[id] || 0, score) }));

  const totalUnits = allUnits.length;
  const doneUnits = Object.keys(scores).length;
  const level = Math.floor(xp / 150) + 1;
  const levelProg = Math.round(((xp % 150) / 150) * 100);
  const rankName = ["Débutant", "Apprenti", "Voyageur", "Causeur", "Éloquent", "Maître"][Math.min(level - 1, 5)];

  const goUnit = (u) => setRoute({ name: "unit", unit: u });

  return (
    <div className="root">
      <style>{CSS}</style>
      <div className="grain" />

      <header className="top">
        <div className="logo" onClick={() => setRoute({ name: "home" })}>
          <span className="mark">L</span>
          <div><strong>Le Parcours</strong><em>Français · A1 → C1</em></div>
        </div>
        <div className="meta">
          <div className="rank"><span>{rankName}</span><small>Niveau {level}</small></div>
          <div className="xp-ring" style={{ "--p": levelProg }}><b>{xp}</b><small>XP</small></div>
        </div>
      </header>

      {route.name === "home" && (
        <main className="home">
          <section className="hero">
            <p className="eyebrow">Apprendre le français · du premier mot à la maîtrise</p>
            <h1>Learn French properly — <span>from your first <em>bonjour</em> to fluent nuance.</span></h1>
            <p className="lede">A structured path through five CEFR levels. Study real grammar, drill with six exercise types, then test your reflexes in challenge mode.</p>
            <div className="hero-row">
              <button className="cta" onClick={() => setRoute({ name: "challenge" })}>⚔ Challenge mode</button>
              <button className="cta outline" onClick={() => setRoute({ name: "daily" })}>
                {dailyClaimed ? "Today's expression" : "Expression du jour"}
              </button>
            </div>
            <div className="hero-prog">
              <div className="hp-bar"><div style={{ width: `${(doneUnits / totalUnits) * 100}%` }} /></div>
              <span>{doneUnits} / {totalUnits} units mastered</span>
            </div>
          </section>

          <div className="levels">
            {CURRICULUM.map((lv) => {
              const lvDone = lv.units.filter((u) => scores[u.id] != null).length;
              const isOpen = openLevel === lv.level;
              return (
                <section key={lv.level} className={`lvl ${isOpen ? "open" : ""}`}>
                  <button className="lvl-head" onClick={() => setOpenLevel(isOpen ? "" : lv.level)}>
                    <span className="badge">{lv.level}</span>
                    <div className="lvl-meta">
                      <h2>{lv.name}</h2>
                      <p>{lv.sub} — {lv.desc}</p>
                    </div>
                    <div className="lvl-side">
                      <span className="lvl-frac">{lvDone}/{lv.units.length}</span>
                      <span className="chev">{isOpen ? "−" : "+"}</span>
                    </div>
                  </button>
                  {isOpen && (
                    <div className="units">
                      {lv.units.map((u, n) => {
                        const sc = scores[u.id];
                        return (
                          <button key={u.id} className="unit-card" style={{ animationDelay: `${n * 60}ms` }}
                            onClick={() => goUnit({ ...u, level: lv.level })}>
                            <div className="uc-head">
                              <h3>{u.title}</h3>
                              {sc != null && <span className={`uc-score ${sc === 100 ? "perfect" : ""}`}>{sc}%</span>}
                            </div>
                            <p className="uc-focus">{u.focus}</p>
                            <div className="uc-foot">
                              <span>{u.vocab.length} words · {u.ex.length} drills</span>
                              <span className="uc-go">Open →</span>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </section>
              );
            })}
          </div>
        </main>
      )}

      {route.name === "unit" && (
        <main className="page">
          <Unit unit={route.unit} onBack={() => setRoute({ name: "home" })} onComplete={completeUnit} awardXP={awardXP} />
        </main>
      )}
      {route.name === "challenge" && (
        <main className="page"><Challenge onExit={() => setRoute({ name: "home" })} awardXP={awardXP} /></main>
      )}
      {route.name === "daily" && (
        <main className="page"><Daily onExit={() => setRoute({ name: "home" })} awardXP={awardXP} claimed={dailyClaimed} claim={() => setDailyClaimed(true)} /></main>
      )}

      <footer className="bottom">Le Parcours · built for serious, joyful study · <em>bon courage</em></footer>
    </div>
  );
}

.build-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tile{background:var(--paper);border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;font-size:15px;font-weight:600;transition:.12s}
.tile:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.tile.placed{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.field{width:100%;padding:15px 18px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
  font-family:inherit;font-size:17px;outline:none;margin-bottom:18px;transition:border-color .2s}
.field:focus{border-color:var(--bleu)}
.field.right{border-color:var(--vert);background:#e7efe8}
.field.wrong{border-color:var(--rouge);background:#f8e9e6}

.verdict{padding:14px 16px;border-radius:11px;font-size:15px}
.verdict span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.verdict.right{background:#e7efe8;color:var(--vert)}
.verdict.wrong{background:#f8e9e6;color:var(--rouge)}
.verdict strong{font-family:'Fraunces',serif}

.result{text-align:center;padding:20px 0}
.score-ring{--p:0;width:120px;height:120px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
  background:conic-gradient(var(--vert) calc(var(--p)*1%),var(--line) 0);position:relative}
.score-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--paper)}
.score-ring span{position:relative;font-family:'Fraunces',serif;font-size:30px}
.result h2{font-size:28px;margin-bottom:8px}
.result p{color:var(--soft);max-width:380px;margin:0 auto 22px}
.result-btns{display:flex;gap:12px;justify-content:center}
.big-score{font-family:'Fraunces',serif;font-size:64px;color:var(--rouge);margin:10px 0}
.big-score span{font-size:22px;color:var(--soft)}

.ch-hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hearts{color:var(--rouge);font-size:20px;letter-spacing:2px}
.hearts .dim{color:var(--line)}
.ch-score{font-weight:700}
.ch-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:18px}

.daily-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 28px;text-align:center;box-shadow:var(--shadow)}
.daily-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--or);font-weight:700}
.daily-fr{font-size:30px;line-height:1.25;margin:14px 0 18px;font-style:italic}
.daily-actions{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.daily-en{color:var(--soft);font-size:16px}

.bottom{text-align:center;color:var(--soft);font-size:13px;padding:24px;position:relative;z-index:1}

@keyframes rise{to{opacity:1;transform:translateY(0)}}
.unit-card{transform:translateY(12px)}

@media(max-width:600px){
  .top{padding:12px 16px}.main,main{padding:22px 16px 40px}
  .hero h1{font-size:30px}.units{grid-template-columns:1fr}
  .lvl-head{padding:16px}.ex{padding:18px}.ex-q{font-size:19px}
}
`;

const container=document.getElementById("root");
ReactDOM.createRoot(container).render(<App />);
</script>
</body>
